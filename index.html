<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VCareRx-DCR</title>
<style>
:root{
  --blue:#0a5c8c; --blue-d:#063f61; --blue-l:#e8f2f8;
  --teal:#0e9b87; --amber:#d98e04; --red:#cf4436; --gray:#6b7785;
  --ink:#1b2733; --muted:#5c6b7a; --line:#d9e2ea; --bg:#f2f5f8; --card:#ffffff;
  --r:10px; --sh:0 1px 3px rgba(11,40,60,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.45}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.4px}
h2{font-size:19px;margin-bottom:4px}
h3{font-size:15px;margin:14px 0 8px;color:var(--blue-d)}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:12px}

/* ---------- login ---------- */
#loginScreen{min-height:100svh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#eaf8ff 0%,#d9f1ff 45%,#ffffff 100%);padding:14px;overflow:hidden}
.login-card{position:relative;background:rgba(255,255,255,.98);border:1px solid #bfe7fb;border-radius:26px;padding:26px 22px;width:100%;max-width:390px;box-shadow:0 18px 55px rgba(26,126,174,.18);overflow:hidden}
.login-card:before{content:"";display:block;height:7px;position:absolute;left:0;right:0;top:0;background:linear-gradient(90deg,#42b8ec,#8bdcff,#ffffff)}
.login-card .brand-mark{width:54px;height:54px;border-radius:16px;background:linear-gradient(145deg,#35b7ed,#087db7);box-shadow:0 8px 20px rgba(8,125,183,.25);font-size:19px}
.login-card .brand b{color:#075b83;font-size:20px}
.login-card .brand small{color:#5d91ab}
.login-card label{color:#3d7691}
.login-card input{border:1px solid #b9dfee;background:#fafdff;border-radius:12px;padding:11px 12px}
.login-card input:focus{outline:2px solid #76c9ee;border-color:#35aee1}
.login-card .btn.full{background:linear-gradient(90deg,#159bd2,#087fb8);border-radius:12px;padding:12px 16px;box-shadow:0 8px 18px rgba(8,127,184,.2)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand-mark{width:42px;height:42px;border-radius:10px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;letter-spacing:-1px}
.brand b{font-size:17px;display:block}
.brand small{color:var(--muted);font-size:11.5px;letter-spacing:.6px;text-transform:uppercase}
.demo-box{background:var(--blue-l);border:1px dashed var(--blue);border-radius:8px;padding:8px 10px;font-size:12px;margin-top:14px;color:var(--blue-d)}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;background:var(--blue);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:600;font-size:13.5px}
.btn:active{transform:translateY(1px)}
.btn.full{width:100%;margin-top:16px}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:7px}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.teal{background:var(--teal)} .btn.red{background:var(--red)} .btn.gray{background:var(--gray)} .btn.amber{background:var(--amber)}

/* ---------- shell ---------- */
#app{display:none;min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;background:#000;color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}
.topbar .ham{background:none;border:0;color:#fff;border-radius:0;padding:4px 8px;font-size:28px;line-height:1}
.topbar .t-title{font-weight:400;font-size:22px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userchip{font-size:11.5px;text-align:right;line-height:1.3}
.userchip b{display:block;font-size:12.5px}
.layout{display:flex;min-height:calc(100vh - 49px)}
nav#sideNav{width:218px;background:#fff;border-right:1px solid var(--line);padding:10px 8px;flex-shrink:0}
nav#sideNav button{display:flex;width:100%;text-align:left;background:none;border:none;padding:9px 11px;border-radius:8px;font-size:13.5px;color:var(--ink);gap:8px;align-items:center;margin-bottom:2px}
nav#sideNav button.active{background:var(--blue);color:#fff;font-weight:600}
nav#sideNav button:hover:not(.active){background:var(--blue-l)}
main#view{flex:1;padding:16px;max-width:1180px;width:100%}
@media(max-width:860px){
  nav#sideNav{position:fixed;left:0;top:49px;bottom:0;z-index:25;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 18px rgba(0,0,0,.2);overflow-y:auto}
  nav#sideNav.open{transform:translateX(0)}
  main#view{padding:12px}
}
#navMask{display:none;position:fixed;inset:49px 0 0 0;background:rgba(0,0,0,.35);z-index:24}
#navMask.show{display:block}

/* ---------- cards / tables ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.kcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:var(--r);padding:12px;box-shadow:var(--sh)}
.kcard .kv{font-size:22px;font-weight:800;color:var(--blue-d)}
.kcard .kl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kcard.teal{border-left-color:var(--teal)} .kcard.amber{border-left-color:var(--amber)}
.kcard.red{border-left-color:var(--red)} .kcard.gray{border-left-color:var(--gray)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar input,.toolbar select{width:auto;min-width:130px;flex:1;max-width:230px;padding:7px 9px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;min-width:560px}
th{background:var(--blue-l);color:var(--blue-d);text-align:left;padding:8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid #edf1f5;vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f7fafc}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.b-green{background:#dcf3e7;color:#0c6b3d}.b-amber{background:#fdeed3;color:#8a5a02}
.b-red{background:#fadfdb;color:#9c2417}.b-gray{background:#e7ebef;color:#4a5663}
.b-blue{background:var(--blue-l);color:var(--blue-d)}.b-purple{background:#ece4f8;color:#5b3a9e}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
@media(max-width:620px){.row,.row3{grid-template-columns:1fr}}
.muted{color:var(--muted);font-size:12px}
.empty{padding:26px;text-align:center;color:var(--muted)}
.gpsline{display:flex;gap:8px;align-items:end}
.gpsline input{flex:1}

/* ---------- modal / toast ---------- */
#modalMask{display:none;position:fixed;inset:0;background:rgba(8,25,40,.55);z-index:50;align-items:flex-start;justify-content:center;padding:20px 10px;overflow-y:auto}
#modalMask.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;padding:18px;margin:auto 0}
.modal h2{display:flex;justify-content:space-between;align-items:center}
.modal .x{background:none;border:none;font-size:22px;color:var(--muted);line-height:1}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#toasts{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:6px;width:min(92vw,360px)}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:9px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:tin .2s}
.toast.ok{background:var(--teal)}.toast.err{background:var(--red)}.toast.warn{background:var(--amber)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}

/* ---------- score / misc ---------- */
.checklist{display:flex;flex-direction:column;gap:6px;max-width:520px;margin-top:4px}
.ckrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px}
.ckrow b{margin-left:auto}
.ckdot{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex:0 0 auto}
.ckdot.ok{background:var(--teal)}
.ckdot.bad{background:#e0563f}
.prodpick{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);padding:8px;background:var(--card)}
.prodchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-size:13px;cursor:pointer;user-select:none;background:#fff;min-height:38px}
.prodchip input{width:17px;height:17px;margin:0;accent-color:var(--teal)}
.prodchip:has(input:checked){background:var(--teal);color:#fff;border-color:var(--teal)}
.prodchip:has(input:checked) span{color:#fff}
.scorebar{height:8px;background:#e7ebef;border-radius:6px;overflow:hidden;margin-top:4px}
.scorebar i{display:block;height:100%;background:var(--teal)}
.actions{white-space:nowrap}
.actions button{margin-right:4px}
.review-card{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}

/* ---------- expense claim ---------- */
.exp-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;border-bottom:1px solid var(--line);padding-bottom:8px}
.exp-tab{background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:12.5px;color:var(--ink)}
.exp-tab.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
.exp-sheet{margin-top:10px}
.exp-head{text-align:center;margin-bottom:8px}
.exp-head b{font-size:17px}
.exp-meta{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:6px}
.exp-meta td{border:1px solid #000;padding:5px 8px}
.exp-grid{border-collapse:collapse;font-size:11.5px;min-width:900px}
.exp-grid th,.exp-grid td{border:1px solid #000;padding:4px 5px}
.exp-grid th{background:#eef3f7;color:#000;font-size:10.5px}
.exp-tot td{background:#f4f7fa;font-weight:600}
.exp-sign{display:flex;justify-content:space-between;margin-top:26px;font-size:12.5px;gap:20px}
@media print{
  .topbar,#sideNav,.toolbar,.actions,.no-print,#toasts,.exp-tabs{display:none!important}
  body{background:#fff}
  main#view{padding:0;max-width:none}
  .panel{border:none;box-shadow:none;padding:0}
  table{min-width:0;font-size:11px}
  .exp-grid{min-width:0;font-size:9px}
  .exp-grid th,.exp-grid td{padding:2px 3px}
  .tbl-wrap{border:none;overflow:visible}
  .exp-sheet .badge{border:1px solid #000;background:#fff!important;color:#000!important}
  body.exp-printing .panel > h2, body.exp-printing .panel > .sub{display:none}
}

/* =====================================================
   VCareRx-DCR mobile home — reference-screen styling
   Dashboard-only presentation; existing data/modules remain intact.
   ===================================================== */
.vc-home{margin:-12px -12px 0;background:#eee;min-height:calc(100vh - 49px);padding-bottom:16px}
.vc-hero{height:368px;background:#08b39b;color:#fff;text-align:center;position:relative;padding-top:70px}
.vc-avatar{width:102px;height:104px;margin:auto;position:relative}
.vc-avatar:before{content:"";position:absolute;top:0;left:24px;width:54px;height:54px;border-radius:50%;background:#fff}
.vc-avatar:after{content:"";position:absolute;left:0;bottom:0;width:102px;height:56px;border-radius:56px 56px 15px 15px;background:#fff}
.vc-name{font-size:29px;margin-top:13px;font-weight:400}
.vc-role{font-size:23px;margin-top:2px}
.vc-version{position:absolute;left:17px;bottom:107px;font-size:21px}
.vc-gear{position:absolute;right:16px;bottom:90px;width:31px;height:31px;border:0;border-radius:50%;background:#079b87;color:#fff;padding:0;font-size:17px}
.vc-attendance{height:150px;background:#eee;text-align:center;padding-top:1px}
.vc-att-title{font-size:30px;color:#444;font-weight:400;padding:4px 0}
.vc-att-buttons{height:77px;display:flex;max-width:538px;margin:auto}
.vc-att-buttons button{width:50%;border:0;font-size:29px;font-weight:400}
.vc-signin{background:#fff;color:#08aa91}
.vc-signout{background:#08b39b;color:#fff}
.vc-signout span{font-size:31px;vertical-align:-2px;margin-left:5px}
.vc-activity{height:357px;background:#06486b;color:#fff;margin:1px 5px 5px;border-radius:3px;position:relative;box-shadow:0 1px 3px #aaa}
.vc-activity-title{font-size:23px;padding:17px 12px}
.vc-activity-icons{position:absolute;right:10px;top:12px;display:flex;gap:13px}
.vc-activity-icons button{border:0;background:none;color:#fff;font-size:28px;padding:0}
.vc-plan{position:absolute;top:132px;width:100%;text-align:center;font-size:20px;line-height:1.5;padding:0 14px}
.vc-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #ddd;border-bottom:1px solid #ddd;background:#eee}
.vc-stats button{border:0;border-right:2px solid #ddd;background:none;color:#444;text-align:center;padding:22px 4px;min-height:145px}
.vc-stats button:last-child{border-right:0}
.vc-stats span{display:block;font-size:24px}
.vc-stats b{display:block;font-size:30px;font-weight:400;margin-top:5px}
.vc-stats small{display:block;font-size:20px;margin-top:3px}
.vc-tiles{display:grid;grid-template-columns:1fr 1fr;background:#eee}
.vc-tiles button{border:0;border-right:2px solid #ddd;background:none;color:#444;text-align:center;padding:27px 4px;font-size:24px}
.vc-tiles button:last-child{border-right:0}
.vc-tile-icon{font-size:35px;display:block;margin-bottom:4px;color:#06486b}
@media(max-width:860px){
  .vc-home{margin:-12px -12px 0;min-height:calc(100vh - 49px)}
  .vc-hero{height:368px}
  .vc-activity{height:335px}
}
@media(min-width:861px){
  .vc-home{margin:-16px -16px 0}
}

/* ---------- mobile-first profile + attendance refinements ---------- */
.vc-att-buttons button{transition:filter .15s,transform .08s,opacity .15s}
.vc-att-buttons button:active{transform:translateY(1px);filter:brightness(.96)}
.vc-att-buttons button[disabled]{opacity:.55;cursor:not-allowed}
.vc-att-state{font-size:11px;color:#5b6570;margin-top:4px;min-height:16px}
.vc-geo-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#0e9b87;margin-right:5px;vertical-align:1px}
.vc-geo-dot.off{background:#9aa3aa}
.vc-bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);background:#202020;color:#fff;position:relative}
.vc-bottom-nav button{border:0;background:none;color:#fff;padding:7px 2px 8px;font-size:11px}
.vc-bottom-nav .bn-icon{display:block;font-size:20px;line-height:20px;margin-bottom:2px}
.vc-bottom-nav button.active{font-weight:700}
@media(max-width:860px){
  html,body{min-height:100%;overflow-x:hidden}
  #loginScreen{height:100svh;min-height:100svh;overflow:hidden;padding:12px;background:linear-gradient(160deg,#063f61,#0a5c8c 52%,#08b39b)}
  .login-card{max-width:390px;padding:22px 20px;border-radius:22px;box-shadow:0 14px 36px rgba(0,20,40,.30)}
  .login-card .demo-box{display:none}
  .login-card .muted{font-size:12px}
  .login-card label{margin-top:8px}
  .login-card input{padding:11px 10px}
  .login-card .btn.full{margin-top:12px;padding:11px}
  .vc-home{margin:-12px -12px 0;min-height:calc(100svh - 49px);height:calc(100svh - 49px);padding:0;display:flex;flex-direction:column;overflow:hidden}
  .vc-hero{height:235px;min-height:235px;padding-top:22px}
  .vc-avatar{width:76px;height:78px}
  .vc-avatar:before{left:18px;width:40px;height:40px}
  .vc-avatar:after{width:76px;height:43px;border-radius:43px 43px 12px 12px}
  .vc-name{font-size:22px;margin-top:7px}
  .vc-role{font-size:17px}
  .vc-version{left:14px;bottom:18px;font-size:15px}
  .vc-gear{right:14px;bottom:16px;width:28px;height:28px;font-size:15px}
  .vc-attendance{height:82px;min-height:82px;padding-top:0}
  .vc-att-title{font-size:19px;padding:3px 0}
  .vc-att-buttons{height:49px;padding:0 12px}
  .vc-att-buttons button{font-size:18px}
  .vc-signout span{font-size:21px}
  .vc-att-state{font-size:9px;line-height:12px;margin-top:1px}
  .vc-activity{height:170px;min-height:170px;margin:3px 4px 3px}
  .vc-activity-title{font-size:16px;padding:10px 10px}
  .vc-activity-icons{right:8px;top:7px;gap:8px}
  .vc-activity-icons button{font-size:21px}
  .vc-plan{top:65px;font-size:14px;padding:0 8px}
  .vc-stats{height:86px;min-height:86px}
  .vc-stats button{min-height:86px;padding:8px 2px}
  .vc-stats span{font-size:14px}
  .vc-stats b{font-size:22px;margin-top:1px}
  .vc-stats small{font-size:11px;margin-top:0}
  .vc-tiles{height:70px;min-height:70px}
  .vc-tiles button{padding:5px 2px;font-size:15px}
  .vc-tile-icon{font-size:20px;margin-bottom:0}
  .vc-bottom-nav{height:55px;min-height:55px}
}

@media(max-width:520px) and (max-height:720px){
  #loginScreen{padding:8px}
  .login-card{padding:20px 18px;border-radius:22px}
  .login-card .brand{margin-bottom:2px}
  .login-card .brand-mark{width:48px;height:48px}
  .login-card label{margin-top:7px}
  .login-card input{padding:9px 10px}
  .login-card .btn.full{margin-top:11px;padding:10px}
}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginScreen">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">VC</div>
      <div><b>VCareRx-DCR</b><small>Field Reporting System</small></div>
    </div>
    <p class="muted" style="margin-top:6px">Offline daily reporting for the field team. Sign in to continue.</p>
    <label for="lgUser">Username</label>
    <input id="lgUser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Username">
    <label for="lgPass">Password</label>
    <input id="lgPass" name="password" type="password" autocomplete="current-password" passwordrules="minlength: 8;" placeholder="Password">
    <button class="btn full" onclick="PRX.login()">Sign in</button>

  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="app">
  <div class="topbar">
    <button class="ham" onclick="PRX.toggleNav()" aria-label="Menu">☰</button>
    <div class="t-title">VCareRx-DCR</div>
    <div class="userchip"><b id="uName"></b><span id="uRole"></span></div>
    <button class="btn sm ghost" style="border-color:rgba(255,255,255,.5);color:#fff;background:none" onclick="PRX.changeMyPassword()" title="Change my password">🔑</button>
    <button class="btn sm ghost" style="border-color:rgba(255,255,255,.5);color:#fff;background:none" onclick="PRX.quickBackup()" title="Download backup now">💾</button>
    <button class="btn sm ghost" style="border-color:rgba(255,255,255,.5);color:#fff;background:none" onclick="PRX.logout()">Logout</button>
  </div>
  <div class="layout">
    <nav id="sideNav"></nav>
    <div id="navMask" onclick="PRX.toggleNav(false)"></div>
    <main id="view"></main>
  </div>
</div>

<div id="modalMask"><div class="modal" id="modalBox"></div></div>
<div id="toasts"></div>

<script>
"use strict";
/* =====================================================
   PRX – Promasscure PRx Field Reporting System
   Modular vanilla-JS, single file, localStorage only.
   ===================================================== */

const fmtMoney = n => "₹" + (Number(n)||0).toLocaleString("en-IN");

function toast(msg, type){
  const t = document.createElement("div");
  t.className = "toast " + (type||"");
  t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

/* ---------------- geo helpers ---------------- */
function haversine(lat1,lon1,lat2,lon2){
  const R=6371000, rad=d=>d*Math.PI/180;
  const dLat=rad(lat2-lat1), dLon=rad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLon/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}
async function getGPS(cb){
  if(!window.isSecureContext && location.hostname!=="localhost" && location.hostname!=="127.0.0.1"){

  }

  try{
    if(navigator.permissions && navigator.permissions.query){
      const perm = await navigator.permissions.query({name:"geolocation"});
      if(perm.state==="denied"){
        toast("Location permission is blocked. Enable Location Services for your browser and try again.","err");
        return cb(null);
      }
    }
  }catch(e){ /* iOS Safari may not expose the Permissions API */ }
  toast("Allow location access when your phone asks. Capturing GPS…");
  navigator.geolocation.getCurrentPosition(
    p => cb({lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6)}),
    e => {
      const msg = e && e.code===1 ? "Location permission denied. Please allow location access in your browser/device settings." : (e && e.message) || "Unable to capture location.";
      toast(msg,"err"); cb(null);
    },
    {enableHighAccuracy:true, timeout:15000, maximumAge:0}
  );
}

  if(dist<=500)  return {label:"Warning", cls:"b-amber", code:"warning"};
  return {label:"Invalid", cls:"b-red", code:"invalid"};
}

function saveAttendance(action, pos){
  const a = DB.get("attendance");

  let rec = arr.find(x=>x.userId===CU.id && x.date===today() && !x.signOutAt);

    arr.push(rec);

    if(!rec){ toast("Please sign in first.","err"); return; }
    if(rec.signOutAt){ toast("You are already signed out.","ok"); renderDashboard(); return; }
    rec.signOutAt=now; rec.signOutLat=pos?pos.lat:""; rec.signOutLng=pos?pos.lng:"";

async function saveBrowserCredential(username, password){
  // Best-effort browser password-manager integration. This does not send the
  // password to VCareRx or Google. Chrome/Android may offer Google Password

  try{

}

/* ---------------- CSV export ---------------- */
function csvDownload(filename, headers, rows){
  const cell = v => { v = String(v==null?"":v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const csv = [headers.map(cell).join(",")].concat(rows.map(r=>r.map(cell).join(","))).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast("CSV exported: " + filename, "ok");
}

function fieldHTML(f, val){
  const v = val==null ? (f.def!==undefined?f.def:"") : val;
  const id = "f_"+f.k, req = f.req ? " *" : "";
  let inp = "";
  if(f.type==="select"){
    const opts = (typeof f.opts==="function"?f.opts():f.opts) || [];
    inp = '<select id="'+id+'">'+(f.req?"":'<option value="">—</option>')
      + opts.map(o=>'<option '+(String(o)===String(v)?"selected":"")+'>'+esc(o)+"</option>").join("") + "</select>";
  } else if(f.type==="multiselect"){
    const opts = (typeof f.opts==="function"?f.opts():f.opts) || [];
    const sel = Array.isArray(v)?v:[];
    inp = '<select id="'+id+'" multiple size="'+Math.min(opts.length,5)+'">'
      + opts.map(o=>'<option '+(sel.includes(o)?"selected":"")+'>'+esc(o)+"</option>").join("") + "</select>"
      + '<div class="muted">Hold Ctrl / long-press to select multiple</div>';
  } else if(f.type==="textarea"){
    inp = '<textarea id="'+id+'" rows="2">'+esc(v)+"</textarea>";
  } else {
    inp = '<input id="'+id+'" type="'+(f.type||"text")+'" value="'+esc(v)+'" '+(f.step?'step="'+f.step+'"':"")+'>';
  }
  return '<div><label for="'+id+'">'+esc(f.label)+req+"</label>"+inp+"</div>";
}
function readField(f){
  const el = $("#f_"+f.k);
  if(!el) return undefined;
  if(f.type==="multiselect") return Array.from(el.selectedOptions).map(o=>o.value);
  if(f.type==="number") return el.value===""?"":Number(el.value);
  return el.value.trim ? el.value.trim() : el.value;
}
function validate(fields, rec){
  for(const f of fields){
    if(f.req && (rec[f.k]===""||rec[f.k]==null||(Array.isArray(rec[f.k])&&!rec[f.k].length))){
      toast("Please fill: " + f.label, "err"); return false;
    }
  }
  return true;
}

function saveMaster(modId, id){
  const cfg = MASTERS[modId];
  const rec = {};
  cfg.fields.forEach(f => rec[f.k] = readField(f));
  if(!validate(cfg.fields, rec)) return;
  const all = DB.get(cfg.key);
  // duplicate prevention (same name [+ area])
  const dup = all.find(r => r.id!==id && cfg.dupCheck.every(k => String(r[k]||"").toLowerCase() === String(rec[k]||"").toLowerCase()));
  if(dup){ toast("Duplicate: "+cfg.noun+" with same "+cfg.dupCheck.join(" + ")+" already exists.","err"); return; }
  if(id){
    const i = all.findIndex(r=>r.id===id);
    all[i] = Object.assign({}, all[i], rec);
  } else {
    rec.id = uid(cfg.idp);
    rec.createdAt = today();
    all.push(rec);
  }
  if(DB.set(cfg.key, all)){ closeModal(); renderMaster(modId); toast(cfg.noun+" saved.","ok"); }
}

  if(!confirm("Delete "+cfg.noun+" \""+rec.name+"\"? This cannot be undone.")) return;

  renderMaster(modId); toast(cfg.noun+" deleted.","ok");

  getGPS(g=>{ if(!g) return; dcrGPS = g; $("#d_gpsinfo").textContent = "Captured: "+g.lat+", "+g.lng; });

function saveDCR(){
  const type = $("#d_ctype").value, cid = $("#d_client").value;
  const mrName = CU.role==="mr" ? CU.name : $("#d_mr").value;
  const workType = $("#d_work").value;
  const isField = !isDcrOff(workType);
  if(isField && !cid){ toast("Select a client (or assign clients to this MR first).","err"); return; }
  if(!$("#d_date").value){ toast("Please fill: Date","err"); return; }
  const key = {Doctor:"doctors",Chemist:"chemists",Stockist:"stockists"}[type];
  // off-days (meeting / holiday / sick leave / PL) ignore client entirely
  const client = isField ? (DB.get(key).find(c=>c.id===cid) || {}) : {};
  const manualReason = $("#d_manual") ? $("#d_manual").value.trim() : "";
  let gpsDist = null, lat="", lng="";
  if(dcrGPS){
    lat = dcrGPS.lat; lng = dcrGPS.lng;
    if(client.lat && client.lng) gpsDist = haversine(dcrGPS.lat, dcrGPS.lng, client.lat, client.lng);
  }
  if(isField && !dcrGPS && !manualReason){
    toast("Capture current GPS before submitting (or Admin/MD manual override).","err"); return;
  }
  const st = manualReason ? {code:"manual"} : gpsStatus(dcrGPS ? gpsDist : null);
  const rec = {
    id:uid("DCR"), date:$("#d_date").value, mr:mrName, area:client.area||"",
    workType, jointWith:$("#d_joint").value, clientType:type, clientId:cid, clientName:client.name||workType,
    products:Array.from(document.querySelectorAll("#d_prodwrap input:checked")).map(o=>o.value),
    samples:$("#d_samples").value.trim(), gifts:$("#d_gifts").value.trim(),
    feedback:$("#d_fb").value.trim(), outcome:$("#d_outcome").value,
    salesGen:Number($("#d_sales").value)||0, orderValue:Number($("#d_order").value)||0,
    payment:Number($("#d_pay").value)||0, nextFollow:$("#d_next").value,
    gpsLat:lat, gpsLng:lng, gpsDist, gpsCode:st.code,
    gpsManual:!!manualReason, gpsManualReason:manualReason,
    review:"pending", reviewComment:"", createdAt:new Date().toISOString()
  };
  const all = DB.get("dcr"); all.push(rec);
  if(!DB.set("dcr", all)) return;
  // auto-update last visit on client master
  if(client.id){
    const list = DB.get(key); const i = list.findIndex(c=>c.id===client.id);
    if(i>-1){ list[i].lastVisit = rec.date; if(type==="Chemist"&&rec.feedback) list[i].feedback=rec.feedback; DB.set(key,list); }
  }
  closeModal(); renderDCR(); toast("DCR submitted — GPS: "+(manualReason?"Manual override":gpsStatus(dcrGPS?gpsDist:null).label),"ok");
}
function exportDCR(){
  let rows = DB.get("dcr"); if(CU.role==="mr") rows = rows.filter(r=>r.mr===CU.name);

function activeAllowance(roleCat){
  const rows = DB.get("allowanceSettings").filter(a=>a.status!=="inactive" && a.roleCat===roleCat);
  rows.sort((x,y)=>String(y.effectiveFrom||"").localeCompare(String(x.effectiveFrom||"")));
  return rows[0] || null;
}
function allowanceFor(roleCat, workType, cityType){
  const a = activeAllowance(roleCat);
  if(!a) return 0;
  if(workType==="Holiday") return num(a.holiday);
  if(workType==="Sunday")  return num(a.sunday);
  if(workType==="Leave")   return num(a.leave);
  if(workType==="Sick Leave"||workType==="PL") return num(a.leave);
  if(workType==="Meeting"||workType==="Review meeting") return num(a.meeting)||num(a.hq);
  if(workType==="Outstation working"||cityType==="Outstation") return num(a.outstation);
  if(cityType==="HQ")    return num(a.hq);
  if(cityType==="Ex-HQ") return num(a.exhq);
  return num(a.hq);
}
function cityRowFor(hq, city){
  if(!hq||!city) return null;
  return DB.get("cityDistanceMaster").find(c=>c.status==="active"
    && String(c.hqCity).toLowerCase()===String(hq).toLowerCase()
    && String(c.city).toLowerCase()===String(city).toLowerCase());
}
function cityOptionsFor(hq){
  return DB.get("cityDistanceMaster").filter(c=>c.status==="active"
    && String(c.hqCity).toLowerCase()===String(hq||"").toLowerCase()).map(c=>c.city);
}

/* ---- monthly claim record ---- */
function monthlyRec(emp, month, create){
  const all = DB.get("expensesMonthly");
  let m = all.find(r=>r.emp===emp && r.month===month);
  if(!m && create){
    const u = userByName(emp)||{};
    m = { id:uid("EXM"), emp, month, hq:u.hq||"", roleCat:roleCatOf(u), manager:mgrNameOf(u),
      diseaseArea:u.diseaseArea||"", sundries:[], deduct:0, add:0, approvedAmount:0,
      mgrComment:"", status:"Draft", approvedBy:"", approvedAt:"", createdAt:new Date().toISOString() };
    all.push(m); DB.set("expensesMonthly", all);
  }
  return m||null;
}
function saveMonthlyRec(m){
  const all = DB.get("expensesMonthly");
  const i = all.findIndex(r=>r.id===m.id);
  if(i>-1) all[i]=m; else all.push(m);
  return DB.set("expensesMonthly", all);
}
function dailyRowsFor(emp, month){
  return DB.get("expensesDaily").filter(r=>r.emp===emp && r.date.startsWith(month))
    .sort((a,b)=>a.date.localeCompare(b.date));
}

/* ---- calculation engine ---- */
function calcDailyTotal(r){
  return r2(num(r.da)+num(r.travel)+num(r.meals)+num(r.carSelf)+num(r.publicTr)+num(r.otherTr));
}
function calcMonthlyExpense(emp, month){
  const rows = dailyRowsFor(emp, month).filter(r=>r.status!=="Rejected");
  const m = monthlyRec(emp, month, false);
  const sum = k => r2(rows.reduce((s,r)=>s+num(r[k]),0));
  const t = { da:sum("da"), travel:sum("travel"), meals:sum("meals"), carSelf:sum("carSelf"),
    publicTr:sum("publicTr"), otherTr:sum("otherTr"), km:sum("km"),
    calls:rows.reduce((s,r)=>s+num(r.calls),0),
    daily:r2(rows.reduce((s,r)=>s+calcDailyTotal(r),0)),
    sundries:r2(((m&&m.sundries)||[]).reduce((s,x)=>s+num(x.amount),0)) };
  t.grand = r2(t.daily + t.sundries);
  t.deduct = m?num(m.deduct):0; t.add = m?num(m.add):0;
  t.adjusted = r2(t.grand - t.deduct + t.add);
  t.approved = m && num(m.approvedAmount) ? num(m.approvedAmount) : (m && EXP_LOCKED.concat(["Reopened"]).includes(m.status) ? t.adjusted : 0);
  t.hqDays = rows.filter(r=>r.workType==="HQ working").length;
  t.exhqDays = rows.filter(r=>r.workType==="Ex-HQ working").length;
  t.outDays = rows.filter(r=>r.workType==="Outstation working").length;
  t.offDays = rows.filter(r=>EXP_NONCITY.includes(r.workType)).length;
  t.workDays = rows.filter(r=>!EXP_NONCITY.includes(r.workType)).length;
  return t;
}
function monthlyLocked(emp, month){
  const m = monthlyRec(emp, month, false);
  return !!(m && EXP_LOCKED.includes(m.status));
}

/* ---- DCR auto-link ---- */
function dcrSuggest(emp, date){
  const d = DB.get("dcr").filter(r=>r.mr===emp && r.date===date && !isDcrOff(r.workType));
  if(!d.length){
    const off = DB.get("dcr").find(r=>r.mr===emp && r.date===date);
    return off ? {city:"", calls:0, joint:"", workType:off.workType} : null;
  }
  const joint = (d.find(r=>r.jointWith && r.jointWith!=="None")||{}).jointWith || "";
  const city = d[0].area || "";
  let wt = "";
  if(d.some(r=>r.workType==="Meeting")) wt = "Meeting";
  else if(d.some(r=>r.workType==="Camp")) wt = "Camp";
  else if(joint) wt = "Joint work";
  return { city, calls:d.length, joint, workType:wt };
}

function calcDailyExpense(refill){
  if(!$("#xd_work")) return;
  const work = $("#xd_work").value, city = $("#xd_city").value.trim(), hq = $("#xd_hq").value.trim();
  const journey = $("#xd_journey").value, mode = $("#xd_mode").value;
  const cm = cityRowFor(hq, city);
  const isHQcity = cm ? cm.cityType==="HQ" : (city && hq && city.toLowerCase()===hq.toLowerCase());
  const cityType = cm ? cm.cityType : (isHQcity ? "HQ" : (work==="Outstation working" ? "Outstation" : (city?"Ex-HQ":"")));
  let info = "";
  if(refill){
    // distance from City Distance Master
    let km = num($("#xd_km").value);
    if(cm){
      km = journey==="Up-down" ? num(cm.upDown) : num(cm.oneWay);
      if(journey==="Stay") km = num(cm.oneWay);
      if(journey==="No travel"||isHQcity) km = isHQcity?0:km;
      $("#xd_km").value = km;
      $("#xd_from").value = $("#xd_from").value || hq;
      info = "City master: "+esc(cm.city)+" • "+esc(cm.cityType)+" • one-way "+num(cm.oneWay)+" km, up-down "+num(cm.upDown)+" km";
    } else if(city && !EXP_NONCITY.includes(work)){
      info = "⚠ City \""+esc(city)+"\" not in City Distance Master — enter km manually. It will be flagged \"Distance approval pending\". You can request it under City Distance tab.";
    }
    // daily allowance
    const da = allowanceFor($("#xd_role").value, work, cityType);
    $("#xd_da").value = da;
  }
  // travel allowance
  const km = num($("#xd_km").value);
  let travel = num($("#xd_travel").value);
  if(mode==="Self vehicle"){
    const rate = cm && num(cm.ratePerKm) ? num(cm.ratePerKm) : ratePerKm();
    travel = (isHQcity || km<=0) ? 0 : r2(km*rate);
    $("#xd_travel").value = travel;
    $("#xd_travel").readOnly = false;
  } else if(mode==="No travel"){
    travel = 0; $("#xd_travel").value = 0;
  }
  if(EXP_NONCITY.includes(work) && refill){ $("#xd_km").value=0; $("#xd_travel").value=0; }
  const total = r2(num($("#xd_da").value)+num($("#xd_travel").value)+num($("#xd_meals").value)+num($("#xd_car").value)+num($("#xd_pt").value)+num($("#xd_other").value));
  $("#xd_total").textContent = fmtMoney(total);
  if($("#xd_cityinfo")) $("#xd_cityinfo").innerHTML = info;
  return total;
}
function saveDailyExpense(id, asDraft){
  id = id || null;
  const emp = expFormCtx ? expFormCtx.emp : curExpEmp();
  const date = $("#xd_date").value, work = $("#xd_work").value, city = $("#xd_city").value.trim();
  if(!date){ toast("Please fill: Date","err"); return; }
  if(!work){ toast("Please fill: Work Type","err"); return; }
  if(!city && !EXP_NONCITY.includes(work) && work!=="Transit"){ toast("City worked is required (except Leave/Holiday/Sunday).","err"); return; }
  if(monthlyLocked(emp, date.slice(0,7))){ toast("Month is approved & locked.","err"); return; }
  const all = DB.get("expensesDaily");
  const dup = all.find(r=>r.emp===emp && r.date===date && r.id!==id);
  if(dup){ toast("An expense for "+emp+" on "+date+" already exists. Edit that entry instead.","err"); return; }
  const km = num($("#xd_km").value), travel = num($("#xd_travel").value);
  const calls = num($("#xd_calls").value);
  if(EXP_FIELDWORK.includes(work) && calls<=0){ toast("Calls done is required for field work types.","err"); return; }
  if(travel>0 && km<=0 && $("#xd_mode").value==="Self vehicle"){ toast("Travel amount needs a distance (or pick Public transport / Car self).","err"); return; }
  const u = userByName(emp)||{};
  const cm = cityRowFor($("#xd_hq").value, city);
  const autoDA = allowanceFor($("#xd_role").value, work, cm?cm.cityType:(city.toLowerCase()===($("#xd_hq").value||"").toLowerCase()?"HQ":(work==="Outstation working"?"Outstation":"Ex-HQ")));
  const da = num($("#xd_da").value);
  const daReason = $("#xd_dareason") ? $("#xd_dareason").value.trim() : "";
  if(da!==autoDA && !daReason && canApproveExp()){ toast("DA override reason required (auto DA is "+fmtMoney(autoDA)+").","err"); return; }
  const old = id ? all.find(r=>r.id===id) : null;
  const rec = {
    id: id||uid("EXD"), date, emp, roleCat:$("#xd_role").value, hq:$("#xd_hq").value,
    manager:$("#xd_mgr").value.trim(), workType:work, fromLoc:$("#xd_from").value.trim(),
    toLoc:city, journey:$("#xd_journey").value, mode:$("#xd_mode").value, km,
    da, daAuto:autoDA, daReason, travel, meals:num($("#xd_meals").value),
    carSelf:num($("#xd_car").value), publicTr:num($("#xd_pt").value), otherTr:num($("#xd_other").value),
    jointWith:$("#xd_joint").value.trim(), calls, remarks:$("#xd_rem").value.trim(),
    attachRef:$("#xd_attach").value.trim(),
    distPending: !!(city && !cm && km>0 && !EXP_NONCITY.includes(work)),
    status: asDraft ? "Draft" : "Submitted",
    createdAt: old?old.createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
  };
  rec.total = calcDailyTotal(rec);
  if(old) Object.assign(old, rec); else all.push(rec);
  if(!DB.set("expensesDaily", all)) return;
  monthlyRec(emp, date.slice(0,7), true);
  if(da!==autoDA && daReason) addExpenseAuditLog("DA manual override", {emp, date, oldAmount:autoDA, newAmount:da, reason:daReason});
  closeModal(); renderExpense();
  toast("Daily expense "+(asDraft?"saved as draft.":"submitted.")+(rec.distPending?" Distance approval pending for "+city+".":""),"ok");
}
function deleteDailyExpense(id){
  const all = DB.get("expensesDaily"); const r = all.find(x=>x.id===id); if(!r) return;
  if(["Approved","Locked"].includes(r.status)||monthlyLocked(r.emp,r.date.slice(0,7))){ toast("Locked entry cannot be deleted.","err"); return; }
  if(!confirm("Delete expense of "+r.emp+" on "+r.date+"?")) return;
  DB.set("expensesDaily", all.filter(x=>x.id!==id));
  addExpenseAuditLog("Daily expense deleted",{emp:r.emp,date:r.date,oldAmount:calcDailyTotal(r)});
  renderExpense(); toast("Entry deleted.","ok");
}

function monthDays(month){
  const [y,m] = month.split("-").map(Number);
  const n = new Date(y, m, 0).getDate(), out=[];
  for(let d=1; d<=n; d++){
    const ds = month+"-"+String(d).padStart(2,"0");
    out.push({date:ds, day:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(ds+"T00:00:00").getDay()]});
  }
  return out;
}
function renderMonthlySheet(emp, month){
  const u = userByName(emp)||{};
  const m = monthlyRec(emp, month, false);
  const rows = dailyRowsFor(emp, month);

function expApproveView(){
  if(!canApproveExp()) return '<div class="empty">Only Manager / CEO / MD / Admin can approve.</div>';

  return '<div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Employee</th><th>Month</th><th>HQ</th><th>Manager</th><th>Claimed ₹</th><th>Deduct/Add</th><th>Approved ₹</th><th>Status</th><th>Action</th></tr></thead><tbody>'
    +(all.length?all.map(m=>{
      const t = calcMonthlyExpense(m.emp, m.month);
      const sb = EXP_LOCKED.includes(m.status)?"b-green":m.status==="Manager Rejected"?"b-red":m.status==="Submitted"?"b-blue":"b-amber";
      const acts = [];
      if(["Submitted","Reopened"].includes(m.status)) acts.push('<button class="btn sm teal" onclick="PRX.approveMonthlyExpense(\''+m.id+'\')">Approve</button><button class="btn sm red" onclick="PRX.rejectMonthlyExpense(\''+m.id+'\')">Reject</button>');
      if(m.status==="Manager Approved" && isExecExp()) acts.push('<button class="btn sm" onclick="PRX.approveMonthlyExpense(\''+m.id+'\',\'final\')">'+(CU.role==="md"?"MD":"CEO")+' Approve</button>');
      if(EXP_LOCKED.includes(m.status)) acts.push('<button class="btn sm amber" onclick="PRX.reopenMonthlyExpense(\''+m.id+'\')">Reopen</button>');
      if(m.status==="Manager Approved"||m.status==="CEO Approved"||m.status==="MD Approved") acts.push('<button class="btn sm gray" onclick="PRX.lockMonthlyExpense(\''+m.id+'\')">Lock</button>');
      return '<tr><td>'+esc(m.emp)+'</td><td>'+esc(m.month)+'</td><td>'+esc(m.hq)+'</td><td>'+esc(m.manager)+'</td><td>'+fmtMoney(t.grand)+'</td><td>−'+fmtMoney(t.deduct)+' / +'+fmtMoney(t.add)+'</td><td>'+(t.approved?fmtMoney(t.approved):"—")+'</td><td><span class="badge '+sb+'">'+esc(m.status)+'</span>'+(m.mgrComment?'<div class="muted">'+esc(m.mgrComment)+'</div>':"")+'</td><td class="actions">'+acts.join(" ")+'</td></tr>';
    }).join(""):'<tr><td colspan="9" class="empty">No monthly claims yet.</td></tr>')
    +'</tbody></table></div>';
}
function approveMonthlyExpense(id, final){
  if(!canApproveExp()){ toast("Not allowed.","err"); return; }
  const m = DB.get("expensesMonthly").find(x=>x.id===id); if(!m) return;
  const t = calcMonthlyExpense(m.emp, m.month);
  openModal((final?"Final ":"")+"Approve — "+m.emp+" ("+m.month+")",
    '<div class="row"><div><label>Total Claimed ₹</label><input value="'+t.grand+'" disabled></div>'
    +'<div><label>Deduct ₹</label><input id="ap_ded" type="number" step="any" value="'+num(m.deduct)+'" oninput="PRX.expAdjCalc('+t.grand+')"></div>'
    +'<div><label>Add ₹</label><input id="ap_add" type="number" step="any" value="'+num(m.add)+'" oninput="PRX.expAdjCalc('+t.grand+')"></div>'
    +'<div><label>Adjusted Amount ₹ (Claimed − Deduct + Add)</label><input id="ap_adj" value="'+t.adjusted+'" disabled></div>'
    +'<div><label>Final Approved ₹ (override allowed)</label><input id="ap_amt" type="number" step="any" value="'+(num(m.approvedAmount)||t.adjusted)+'"></div></div>'
    +'<div><label>Reason / Comment'+'</label><textarea id="ap_reason" rows="2">'+esc(m.mgrComment||"")+'</textarea></div>'
    +'<div class="muted">Reason is mandatory if Deduct/Add is used or the approved amount differs from the claimed amount.</div>',
    '<button class="btn teal" onclick="PRX.doApproveExpense(\''+id+'\','+(final?'true':'false')+')">Confirm Approve</button>');
}
function expAdjCalc(grand){
  $("#ap_adj").value = r2(grand - num($("#ap_ded").value) + num($("#ap_add").value));
  $("#ap_amt").value = $("#ap_adj").value;
}
function doApproveExpense(id, final){
  const all = DB.get("expensesMonthly"); const m = all.find(x=>x.id===id); if(!m) return;
  const t = calcMonthlyExpense(m.emp, m.month);
  const ded = num($("#ap_ded").value), add = num($("#ap_add").value), amt = num($("#ap_amt").value);
  const reason = $("#ap_reason").value.trim();
  if((ded||add||amt!==t.grand) && !reason){ toast("Reason required when approving more/less than claimed.","err"); return; }
  const oldAmt = num(m.approvedAmount);
  m.deduct = ded; m.add = add; m.approvedAmount = amt; m.mgrComment = reason;
  m.status = final ? (CU.role==="md" ? "MD Approved" : "CEO Approved") : "Manager Approved";
  m.approvedBy = CU.name; m.approvedAt = new Date().toISOString();
  DB.set("expensesMonthly", all);
  // lock all daily rows of the month
  const d = DB.get("expensesDaily");
  d.forEach(r=>{ if(r.emp===m.emp && r.date.startsWith(m.month) && r.status!=="Rejected"){ r.status = final?"Locked":"Approved"; } });
  DB.set("expensesDaily", d);
  addExpenseAuditLog(final?"Final approval":"Manager approved", {emp:m.emp, month:m.month, oldAmount:oldAmt, newAmount:amt, reason});
  closeModal(); renderExpense(); toast("Claim approved ("+fmtMoney(amt)+") and locked.","ok");
}
function rejectMonthlyExpense(id){
  if(!canApproveExp()){ toast("Not allowed.","err"); return; }
  const all = DB.get("expensesMonthly"); const m = all.find(x=>x.id===id); if(!m) return;
  const reason = prompt("Rejection reason (required):","");
  if(reason===null) return;
  if(!reason.trim()){ toast("Reason is required to reject.","err"); return; }
  m.status="Manager Rejected"; m.mgrComment=reason.trim(); m.approvedBy=CU.name; m.approvedAt=new Date().toISOString();
  DB.set("expensesMonthly", all);
  const d = DB.get("expensesDaily");
  d.forEach(r=>{ if(r.emp===m.emp && r.date.startsWith(m.month) && r.status==="Submitted") r.status="Draft"; });
  DB.set("expensesDaily", d);
  addExpenseAuditLog("Claim rejected",{emp:m.emp,month:m.month,reason:reason.trim()});
  renderExpense(); toast("Claim rejected — rows returned to draft.","ok");
}
function reopenMonthlyExpense(id){
  if(!canApproveExp()){ toast("Only Manager/CEO/MD/Admin can reopen.","err"); return; }
  const all = DB.get("expensesMonthly"); const m = all.find(x=>x.id===id); if(!m) return;
  const reason = prompt("Reopen reason (required, will be audit-logged):","");
  if(reason===null) return;
  if(!reason.trim()){ toast("Reason is required to reopen.","err"); return; }
  if(!confirm("Reopen "+m.emp+" "+m.month+"? The employee will be able to edit again.")) return;
  const oldAmt = num(m.approvedAmount);
  m.status="Reopened";
  DB.set("expensesMonthly", all);
  const d = DB.get("expensesDaily");
  d.forEach(r=>{ if(r.emp===m.emp && r.date.startsWith(m.month) && ["Approved","Locked"].includes(r.status)) r.status="Submitted"; });
  DB.set("expensesDaily", d);
  addExpenseAuditLog("Claim reopened",{emp:m.emp,month:m.month,oldAmount:oldAmt,reason:reason.trim()});
  renderExpense(); toast("Claim reopened.","ok");
}
function lockMonthlyExpense(id){
  if(!canApproveExp()){ toast("Not allowed.","err"); return; }
  const all = DB.get("expensesMonthly"); const m = all.find(x=>x.id===id); if(!m) return;
  if(!confirm("Lock "+m.emp+" "+m.month+" permanently (until reopened)?")) return;
  m.status="Locked"; DB.set("expensesMonthly", all);
  const d = DB.get("expensesDaily");
  d.forEach(r=>{ if(r.emp===m.emp && r.date.startsWith(m.month) && r.status!=="Rejected") r.status="Locked"; });
  DB.set("expensesDaily", d);
  addExpenseAuditLog("Claim locked",{emp:m.emp,month:m.month,newAmount:num(m.approvedAmount)});
  renderExpense(); toast("Claim locked.","ok");
}

function saveCityDistance(id){
  if(!canApproveExp()){ toast("Not allowed.","err"); return; }

  if(!hq||!city){ toast("HQ and City are required.","err"); return; }

    allowanceType:$("#cd_allow").value, status:"active", updatedBy:CU.name };
  if(id){ const i=all.findIndex(x=>x.id===id); all[i]=Object.assign({},all[i],rec); }
  else { rec.id=uid("CDM"); rec.createdBy=CU.name; all.push(rec); }

function saveCityDistanceRequest(){

function approveCityDistance(id){

  c.status="active"; c.updatedBy=CU.name;

  addExpenseAuditLog("City distance approved",{reason:c.hqCity+" → "+c.city+" ("+num(c.upDown)+" km up-down)"});
  renderExpense(); toast("City approved — distance will now auto-fill.","ok");
}
function deleteCityDistance(id){
  if(!canApproveExp()) return;
  const all = DB.get("cityDistanceMaster"); const c = all.find(x=>x.id===id); if(!c) return;
  if(!confirm("Delete city \""+c.city+"\" from the distance master?")) return;

  addExpenseAuditLog("City distance deleted",{reason:c.hqCity+" → "+c.city});
  renderExpense(); toast("City deleted.","ok");
}

/* ---------------- MR performance score ---------------- */
function mrScore(mrName, month){
  const dcr = DB.get("dcr").filter(r=>r.mr===mrName && r.date.startsWith(month));
  const field = dcr.filter(r=>!isDcrOff(r.workType));
  const user = DB.get("users").find(u=>u.name===mrName) || {};
  const docs = DB.get("doctors").filter(d=>d.mr===mrName && d.status==="active");
  const focusSet = new Set(DB.get("products").filter(p=>p.focus==="Yes").map(p=>p.name));
  const pct = (n,d) => d? n/d : 0;
  const cap = (v,max) => Math.round(Math.min(v,1)*max);

  const callsPart   = cap(pct(field.length, 100), 25);                              // 100 calls/month target
  const visited     = new Set(field.filter(r=>r.clientType==="Doctor").map(r=>r.clientId));
  const covPart     = cap(pct(visited.size, docs.length||1), 15);
  const gpsOk       = field.filter(r=>r.gpsManual || (r.gpsCode||gpsStatus(r.gpsDist).code)==="valid").length;
  const gpsPart     = cap(pct(gpsOk, field.length||1), 20);
  const salesAmt    = dcr.reduce((s,r)=>s+(r.salesGen||0)+(r.orderValue||0),0)
                    + DB.get("sales").filter(s=>s.mr===mrName&&s.date.startsWith(month)).reduce((s,r)=>s+(r.amount||0),0);
  const salesPart   = cap(pct(salesAmt, Number(user.target)||50000), 20);
  const focusPart   = cap(pct(field.filter(r=>(r.products||[]).some(p=>focusSet.has(p))).length, field.length||1), 10);
  const jointPart   = cap(pct(field.filter(r=>r.jointWith&&r.jointWith!=="None").length, 4), 5);  // 4 joint calls/month
  const fbPart      = cap(pct(field.filter(r=>(r.feedback||"").length>=10).length, field.length||1), 5);
  const parts = [["Calls",callsPart,25],["Doctor coverage",covPart,15],["GPS valid",gpsPart,20],["Sales",salesPart,20],["Focus products",focusPart,10],["Joint work",jointPart,5],["Feedback quality",fbPart,5]];
  return { total: parts.reduce((s,p)=>s+p[1],0), parts };
}
function showScore(mrName){
  const sc = mrScore(mrName, thisMonth());
  openModal("Performance — "+mrName+" ("+thisMonth()+")",
    '<div class="kcard" style="margin-bottom:10px"><div class="kv">'+sc.total+' / 100</div><div class="scorebar"><i style="width:'+sc.total+'%"></i></div></div>'
    +'<div class="tbl-wrap"><table><thead><tr><th>Component</th><th>Score</th><th>Max</th></tr></thead><tbody>'
    +sc.parts.map(p=>"<tr><td>"+esc(p[0])+"</td><td>"+p[1]+"</td><td>"+p[2]+"</td></tr>").join("")+"</tbody></table></div>","");
}

    r: DB.get("cityDistanceMaster").map(c=>[c.hqCity,c.city,c.oneWay,c.upDown,c.cityType,c.travelMode,c.ratePerKm||"",c.status]) };
  if(t==="expaudit") return { h:["Date/Time","User","Role","Action","Employee","Month/Date","Old ₹","New ₹","Reason"],
    r: DB.get("expenseAuditLogs").slice().reverse().map(l=>[(l.ts||"").replace("T"," ").slice(0,16),l.user,l.role,l.action,l.emp||"",l.month||l.date||"",l.oldAmount==null?"":l.oldAmount,l.newAmount==null?"":l.newAmount,l.reason||""]) };
  if(t==="salestrend"){
    // monthly sales trend (role-aware): DCR sales+orders + Sales module, by month
    let dcr = DB.get("dcr"), sal = DB.get("sales");
    if(CU.role==="mr"){ dcr = dcr.filter(r=>r.mr===CU.name); sal = sal.filter(s=>s.mr===CU.name); }
    if(RPT.mr){ dcr = dcr.filter(r=>r.mr===RPT.mr); sal = sal.filter(s=>s.mr===RPT.mr); }
    if(RPT.from){ dcr=dcr.filter(r=>r.date>=RPT.from); sal=sal.filter(s=>s.date>=RPT.from); }
    if(RPT.to){ dcr=dcr.filter(r=>r.date<=RPT.to); sal=sal.filter(s=>s.date<=RPT.to); }
    const map = {};
    const bucket = mo => (map[mo] = map[mo] || {calls:0, sales:0, orders:0, pay:0});
    dcr.forEach(r=>{ const mo=(r.date||"").slice(0,7); if(!mo) return; const b=bucket(mo);
      if(!isDcrOff(r.workType)) b.calls++;
      b.sales+=Number(r.salesGen)||0; b.orders+=Number(r.orderValue)||0; b.pay+=Number(r.payment)||0; });
    sal.forEach(s=>{ const mo=(s.date||"").slice(0,7); if(!mo) return; bucket(mo).sales+=Number(s.amount)||0; });
    const months = Object.keys(map).sort();
    let prev=null;
    const rows = months.map(mo=>{ const b=map[mo]; const total=b.sales+b.orders;
      const tr = prev==null? "—" : (prev===0? "+∞" : (total>=prev?"+":"")+Math.round((total-prev)/prev*100)+"%");
      prev=total;
      return [mo, b.calls, Math.round(b.sales), Math.round(b.orders), Math.round(total), Math.round(b.pay), tr]; });
    return { h:["Month","Field Calls","Sales ₹","Orders ₹","Total Revenue ₹","Payment ₹","MoM Trend"], r: rows };
  }
  if(t==="pnl"){
    // monthly P&L: revenue (sales+orders) vs approved expenses (role-aware)
    let dcr = DB.get("dcr"), sal = DB.get("sales"), exp = DB.get("expensesMonthly");
    if(CU.role==="mr"){ dcr=dcr.filter(r=>r.mr===CU.name); sal=sal.filter(s=>s.mr===CU.name); exp=exp.filter(x=>x.emp===CU.name); }
    if(RPT.mr){ dcr=dcr.filter(r=>r.mr===RPT.mr); sal=sal.filter(s=>s.mr===RPT.mr); exp=exp.filter(x=>x.emp===RPT.mr); }
    if(RPT.from){ const f=RPT.from.slice(0,7); dcr=dcr.filter(r=>r.date>=RPT.from); sal=sal.filter(s=>s.date>=RPT.from); exp=exp.filter(x=>x.month>=f); }
    if(RPT.to){ const tt=RPT.to.slice(0,7); dcr=dcr.filter(r=>r.date<=RPT.to); sal=sal.filter(s=>s.date<=RPT.to); exp=exp.filter(x=>x.month<=tt); }
    const map = {};
    const b = mo => (map[mo]=map[mo]||{rev:0, exp:0});
    dcr.forEach(r=>{ const mo=(r.date||"").slice(0,7); if(mo) b(mo).rev+=(Number(r.salesGen)||0)+(Number(r.orderValue)||0); });
    sal.forEach(s=>{ const mo=(s.date||"").slice(0,7); if(mo) b(mo).rev+=Number(s.amount)||0; });
    exp.forEach(x=>{ const t2=calcMonthlyExpense(x.emp,x.month); b(x.month).exp += (t2.approved||t2.grand||0); });
    const months = Object.keys(map).sort();
    const rows = months.map(mo=>{ const o=map[mo]; const net=o.rev-o.exp;
      const margin = o.rev? Math.round(net/o.rev*100)+"%" : "—";
      return [mo, Math.round(o.rev), Math.round(o.exp), Math.round(net), margin]; });
    // totals row
    const tot = months.reduce((a,mo)=>{a.rev+=map[mo].rev; a.exp+=map[mo].exp; return a;},{rev:0,exp:0});
    if(months.length){ const net=tot.rev-tot.exp; rows.push(["TOTAL", Math.round(tot.rev), Math.round(tot.exp), Math.round(net), tot.rev?Math.round(net/tot.rev*100)+"%":"—"]); }
    return { h:["Month","Revenue ₹","Expenses ₹","Net (Rev−Exp) ₹","Margin %"], r: rows };
  }
  return {h:[],r:[]};
}

function renderBackup(){

    +'<div class="toolbar"><button class="btn" onclick="PRX.exportBackup()">⬇ Export Full Backup (JSON)</button>'
    +'<label class="btn ghost" style="margin:0"><input type="file" accept=".json,application/json" style="display:none" onchange="PRX.importBackup(this)">⬆ Import Backup</label>'
    +'<button class="btn red" onclick="PRX.resetDemo()">Reset Demo Data</button></div>'
    +'<div class="muted">Import validates the file structure before overwriting. Always export a backup before importing or resetting. A daily backup file is auto-downloaded on your first login each day; the 💾 button in the top bar downloads one any time.</div></div>';

function exportBackup(){
  const data = {app:"PromasscurePRx", version:1, exportedAt:new Date().toISOString(), data:{}};
  KEYS.forEach(k=>data.data[k]=DB.get(k));
  const blob = new Blob([JSON.stringify(data,null,1)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "prx_backup_"+today()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast("Backup exported.","ok");
}
function importBackup(inp){
  const f = inp.files && inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const j = JSON.parse(rd.result);
      if(!j || j.app!=="PromasscurePRx" || !j.data || !Array.isArray(j.data.users))
        throw new Error("Not a valid PRx backup file.");
      if(!confirm("Import backup from "+(j.exportedAt||"unknown date")+"? Current data will be replaced.")) return;
      KEYS.forEach(k=>{ if(j.data[k]!==undefined) DB.set(k, j.data[k]); });
      toast("Backup imported successfully.","ok"); go("dashboard");
    }catch(e){ toast("Import failed: "+e.message,"err"); }
    inp.value="";
  };
  rd.readAsText(f);
}

function saveUser(id){
  if(CU.role!=="admin"){ toast("Only Admin can access Settings and user management.","err"); return; }
  const name=$("#u_name").value.trim(), un=$("#u_user").value.trim().toLowerCase(), pw=$("#u_pass").value;
  if(!name||!un||(!id&&!pw)){ toast("Name, username"+(id?"":" and password")+" are required.","err"); return; }
  const all = DB.get("users");
  if(all.find(x=>x.username===un && x.id!==id)){ toast("Username already exists.","err"); return; }
  const extra = {name, username:un, role:$("#u_role").value, hq:$("#u_hq").value.trim(),
    manager:$("#u_mgr").value.trim(), diseaseArea:$("#u_da").value.trim(),
    target:Number($("#u_target").value)||0, status:$("#u_status").value};
  if(id){
    const i = all.findIndex(x=>x.id===id);
    Object.assign(all[i], extra);
    if(pw) all[i].password = pw;   // blank keeps current password
  } else {
    all.push(Object.assign({id:uid("USR"), password:pw, status:"active"}, extra));
  }
  if(DB.set("users",all)){ closeModal(); renderSettings(); toast("User saved.","ok"); }
}

function mergeProductPortfolio(){
  // one-time, non-destructive: add portfolio products missing from current Product Master
  const s = settings();
  if(s.prodPortfolioV1) return;
  const cur = DB.get("products");
  const have = new Set(cur.map(p=>String(p.name).trim().toLowerCase()));
  let added = 0, maxN = cur.reduce((mx,p)=>{ const n=parseInt(String(p.id).replace(/\D/g,""))||0; return n>mx?n:mx; }, 0);
  PRODUCT_PORTFOLIO.forEach(p=>{
    if(!have.has(p.name.trim().toLowerCase())){
      cur.push(Object.assign({}, p, {id:"PR-"+String(++maxN).padStart(3,"0")}));
      have.add(p.name.trim().toLowerCase()); added++;
    }
  });
  if(added) DB.set("products", cur);
  s.prodPortfolioV1 = true; DB.set("settings", s);
}

  // one-time: remove the original 5 demo products, keep only the real portfolio (+ any user-added)

  s.demoProdCleanV1 = true; DB.set("settings", s);
}
