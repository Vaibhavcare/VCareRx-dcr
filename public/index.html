<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V-CareRx DCR</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4fbff;
  color:#263238
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.loginPage{
  min-height:100vh;
  background:linear-gradient(145deg,#e9f9ff,#ffffff 48%,#dff7ff);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px
}

.loginBox{
  width:100%;
  max-width:430px;
  background:#fff;
  border:1px solid #d8eef7;
  border-radius:26px;
  padding:28px;
  box-shadow:0 18px 50px rgba(0,90,130,.15)
}

.logo{
  width:90px;
  height:90px;
  border-radius:24px;
  background:linear-gradient(145deg,#08aeea,#075078);
  color:#fff;
  display:grid;
  place-items:center;
  margin:0 auto 18px;
  font-weight:bold;
  font-size:17px;
  box-shadow:0 10px 25px rgba(0,120,180,.22)
}

.loginBox h1{text-align:center;margin:0;color:#075078}
.loginBox p{text-align:center;color:#68757b}

.field{margin:13px 0}
label{display:block;font-weight:bold;margin-bottom:6px;color:#34505b}

input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #c9e1eb;
  border-radius:10px;
  background:#fff;
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:#08aeea;
  box-shadow:0 0 0 3px #08aeea22
}

textarea{min-height:90px}

.btn{
  border:0;
  background:#08aeea;
  color:white;
  border-radius:10px;
  padding:10px 15px;
  font-weight:bold
}

.btn.blue{background:#075078}
.btn.red{background:#c62828}
.btn.gray{background:#68757b}
.btn.green{background:#08a994}

.loginBtn{
  width:100%;
  padding:14px;
  font-size:17px;
  margin-top:5px
}

.error{
  color:#c62828;
  text-align:center;
  margin-top:12px;
  font-weight:bold
}

.app{min-height:100vh}

.top{
  height:62px;
  background:linear-gradient(90deg,#075078,#08aeea);
  color:white;
  display:flex;
  align-items:center;
  padding:0 15px;
  position:sticky;
  top:0;
  z-index:20
}

.menu{
  background:none;
  color:white;
  border:0;
  font-size:28px;
  margin-right:16px
}

.brand{font-size:20px;font-weight:bold}
.topRight{margin-left:auto}
.topRight button{
  background:white;
  color:#075078;
  border:0;
  border-radius:8px;
  padding:8px 12px;
  font-weight:bold
}

.sidebar{
  position:fixed;
  left:0;
  top:62px;
  bottom:0;
  width:250px;
  background:white;
  border-right:1px solid #dcebf1;
  overflow:auto;
  z-index:10
}

.profile{
  background:linear-gradient(145deg,#075078,#08aeea);
  color:white;
  text-align:center;
  padding:20px
}

.avatar{
  width:65px;
  height:65px;
  background:white;
  color:#075078;
  border-radius:20px;
  display:grid;
  place-items:center;
  margin:auto;
  font-size:28px;
  font-weight:bold
}

.nav button{
  width:100%;
  border:0;
  background:white;
  text-align:left;
  padding:14px 18px;
  color:#304a55
}

.nav button:hover,
.nav button.active{
  background:#e6f8ff;
  color:#007fb8;
  font-weight:bold
}

.main{
  margin-left:250px;
  padding:18px
}

.hero{
  background:linear-gradient(135deg,#08aeea,#075078);
  color:white;
  padding:23px;
  border-radius:16px;
  margin-bottom:18px;
  box-shadow:0 8px 25px #07507822
}

.hero h2{margin:0 0 6px}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px
}

.card{
  background:white;
  padding:18px;
  border-radius:14px;
  border:1px solid #e0edf2;
  box-shadow:0 3px 12px #07507810
}

.number{
  font-size:29px;
  font-weight:bold;
  margin-top:8px;
  color:#075078
}

.panel{
  background:white;
  padding:18px;
  border-radius:14px;
  margin-top:18px;
  border:1px solid #e0edf2;
  box-shadow:0 3px 12px #07507810
}

.panel h2{margin-top:0;color:#075078}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px
}

table{
  width:100%;
  border-collapse:collapse
}

th,td{
  padding:10px 7px;
  border-bottom:1px solid #e0e8eb;
  text-align:left;
  font-size:13px
}

th{
  background:#edf8fc;
  color:#075078
}

.tableWrap{overflow:auto}

.badge{
  padding:4px 8px;
  border-radius:20px;
  background:#dff5ef;
  color:#087d6e;
  font-size:12px
}

.off{
  background:#eee;
  color:#777
}

.location{
  background:#edf9ff;
  padding:15px;
  border-radius:10px;
  border:1px solid #d6edf7
}

.small{
  padding:7px 9px;
  font-size:12px
}

.muted{color:#69777d}

.switch{
  display:flex;
  gap:10px;
  align-items:center;
  padding:15px 0;
  border-bottom:1px solid #eee
}

.switch input{width:auto}

.roleCard{
  background:#f3fbff;
  border:1px solid #d8eef7;
  border-radius:12px;
  padding:14px;
  margin-top:10px
}

.statusOn{
  color:#07866f;
  font-weight:bold
}

.statusOff{
  color:#c62828;
  font-weight:bold
}

@media(max-width:800px){
  .sidebar{
    transform:translateX(-100%);
    transition:.2s;
    width:270px
  }

  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .cards{grid-template-columns:repeat(2,1fr)}
  .grid,.grid3{grid-template-columns:1fr}
}

@media(max-width:450px){
  .cards{grid-template-columns:1fr 1fr}
  .card{padding:13px}
  .main{padding:10px}
  .loginBox{padding:22px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="loginPage">

  <div class="loginBox">

    <div class="logo">V-CareRx</div>

    <h1>V-CareRx DCR</h1>
    <p>Medical Representative Reporting System</p>

    <div class="field">
      <label>Login ID</label>
      <input id="loginId" placeholder="Enter Login ID" autocomplete="username">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="loginPassword" type="password"
             placeholder="Enter Password"
             autocomplete="current-password">
    </div>

    <button class="btn loginBtn" onclick="login()">
      LOGIN
    </button>

    <div id="loginError" class="error"></div>

  </div>
</div>


<!-- APPLICATION -->
<div id="app" class="app hidden">

<header class="top">

  <button class="menu" onclick="toggleMenu()">☰</button>

  <div class="brand">
    V-CareRx DCR
  </div>

  <div class="topRight">
    <button onclick="logout()">Logout</button>
  </div>

</header>


<aside id="sidebar" class="sidebar">

  <div class="profile">

    <div class="avatar" id="profileAvatar">V</div>

    <h3 id="profileName">User</h3>

    <small id="profileRole">User</small>

  </div>


  <!-- ADMIN / MANAGEMENT NAV -->
  <div class="nav hidden" id="managementNav">

    <button onclick="page('dashboard')">
      🏠 Dashboard
    </button>

    <button onclick="page('summary')">
      📊 Quick Summary
    </button>

    <button onclick="page('representatives')">
      👥 Medical Representatives
    </button>

    <button onclick="page('doctors')">
      🩺 Doctors
    </button>

    <button onclick="page('chemists')">
      💊 Chemists
    </button>

    <button onclick="page('stockists')">
      📦 Stockists
    </button>

    <button onclick="page('products')">
      🧴 Products
    </button>

    <button onclick="page('assignments')">
      🔗 Assignments
    </button>

    <button onclick="page('dcr')">
      📝 DCR
    </button>

    <button onclick="page('visitStatus')">
      📅 Doctor Visit Status
    </button>

    <button onclick="page('tour')">
      🗺️ Tour Plan
    </button>

    <button onclick="page('reports')">
      📈 Reports
    </button>

    <button id="settingsButton" onclick="page('settings')">
      ⚙️ Admin Settings
    </button>

    <button onclick="logout()">
      🚪 Sign Out
    </button>

  </div>


  <!-- REPRESENTATIVE NAV -->
  <div class="nav hidden" id="repNav">

    <button onclick="page('repHome')">
      🏠 My Dashboard
    </button>

    <button onclick="page('myClients')">
      👨‍⚕️ My Clients
    </button>

    <button onclick="page('dcr')">
      📝 DCR Entry
    </button>

    <button onclick="page('tour')">
      🗺️ My Tour Plan
    </button>

    <button onclick="page('repSummary')">
      📊 My Summary
    </button>

    <button onclick="logout()">
      🚪 Sign Out
    </button>

  </div>

</aside>


<main id="main" class="main"></main>

</div>


<script>

/* =====================================================
   V-CARE RX DCR DATABASE
===================================================== */

const ADMIN_ID = "Vaibhav";
const ADMIN_PASSWORD = "Vaibhav@123";

const DEFAULT_USERS = [

  {
    id:"CEO001",
    name:"CEO",
    role:"ceo",
    password:"CEO@123",
    active:true
  },

  {
    id:"MD001",
    name:"MD",
    role:"md",
    password:"MD@123",
    active:true
  },

  {
    id:"MGR001",
    name:"Manager",
    role:"manager",
    password:"Manager@123",
    active:true
  },

  {
    id:"MR001",
    name:"Medical Representative",
    role:"mr",
    password:"MR@123",
    phone:"",
    active:true
  }

];


let db = JSON.parse(
  localStorage.getItem("VCARERX_DATABASE") || "null"
);


if(!db){

  db = {

    users:DEFAULT_USERS,

    representatives:[
      {
        id:"MR001",
        name:"Medical Representative",
        password:"MR@123",
        phone:"",
        active:true
      }
    ],

    doctors:[],
    chemists:[],
    stockists:[],
    products:[],
    assignments:[],
    dcr:[],
    tours:[],

    settings:{
      gpsRequired:true
    }

  };

  save();
}


let currentUser = null;
let dcrGPS = null;


function save(){

  localStorage.setItem(
    "VCARERX_DATABASE",
    JSON.stringify(db)
  );

}


function esc(v){

  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");

}


/* =====================================================
   LOGIN
===================================================== */

function login(){

  const id =
    document.getElementById("loginId")
      .value.trim();

  const password =
    document.getElementById("loginPassword")
      .value;

  document.getElementById("loginError")
    .innerText="";


  /* ADMIN */

  if(
    id === ADMIN_ID &&
    password === ADMIN_PASSWORD
  ){

    currentUser = {

      id:"ADMIN",
      name:"Vaibhav",
      role:"admin"

    };

    openApp();
    return;

  }


  /* MANAGEMENT / MR */

  let user =
    db.users.find(u =>
      u.id.toLowerCase() === id.toLowerCase() &&
      u.password === password
    );


  /* Existing representative records */

  if(!user){

    const rep =
      db.representatives.find(r =>
        r.id.toLowerCase() === id.toLowerCase() &&
        r.password === password
      );

    if(rep){

      user = {

        id:rep.id,
        name:rep.name,
        role:"mr",
        password:rep.password,
        active:rep.active

      };

    }

  }


  if(!user){

    document.getElementById("loginError")
      .innerText="Invalid ID or password";

    return;

  }


  if(user.active === false){

    document.getElementById("loginError")
      .innerText="This account is inactive.";

    return;

  }


  currentUser = {

    id:user.id,
    name:user.name,
    role:user.role

  };


  openApp();

}


/* ENTER KEY LOGIN */

document.getElementById("loginPassword")
.addEventListener("keydown",function(e){

  if(e.key==="Enter") login();

});


/* =====================================================
   OPEN APPLICATION
===================================================== */

function openApp(){

  document.getElementById("loginPage")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.remove("hidden");


  document.getElementById("profileName")
    .innerText=currentUser.name;


  document.getElementById("profileRole")
    .innerText=getRoleName(currentUser.role);


  document.getElementById("profileAvatar")
    .innerText=
    currentUser.name.charAt(0).toUpperCase();


  const managementRoles =
    ["admin","ceo","md","manager"];


  if(managementRoles.includes(currentUser.role)){

    document.getElementById("managementNav")
      .classList.remove("hidden");

    document.getElementById("repNav")
      .classList.add("hidden");

    document.getElementById("settingsButton")
      .classList.toggle(
        "hidden",
        currentUser.role!=="admin"
      );

    page("dashboard");

  }else{

    document.getElementById("managementNav")
      .classList.add("hidden");

    document.getElementById("repNav")
      .classList.remove("hidden");

    page("repHome");

  }

}


function getRoleName(role){

  const names={

    admin:"Administrator",
    ceo:"Chief Executive Officer",
    md:"Managing Director",
    manager:"Manager",
    mr:"Medical Representative"

  };

  return names[role] || role;

}


/* =====================================================
   ADMIN ACCESS PROTECTION
===================================================== */

function adminOnly(){

  if(!currentUser || currentUser.role!=="admin"){

    alert("Admin access required.");

    if(currentUser && currentUser.role!=="mr"){
      page("dashboard");
    }else{
      page("repHome");
    }

    return false;

  }

  return true;

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

  currentUser=null;

  document.getElementById("app")
    .classList.add("hidden");

  document.getElementById("loginPage")
    .classList.remove("hidden");

  document.getElementById("loginId").value="";
  document.getElementById("loginPassword").value="";

}


/* =====================================================
   NAVIGATION
===================================================== */

function toggleMenu(){

  document.getElementById("sidebar")
    .classList.toggle("open");

}


function page(name){

  document.getElementById("sidebar")
    .classList.remove("open");


  /* Admin settings protected */

  if(name==="settings" && !adminOnly()) return;


  if(name==="dashboard") dashboard();
  if(name==="summary") summary();
  if(name==="representatives") representatives();
  if(name==="doctors") doctors();
  if(name==="chemists") chemists();
  if(name==="stockists") stockists();
  if(name==="products") products();
  if(name==="assignments") assignments();
  if(name==="dcr") dcr();
  if(name==="visitStatus") visitStatus();
  if(name==="tour") tour();
  if(name==="reports") reports();
  if(name==="settings") settings();

  if(name==="repHome") repHome();
  if(name==="myClients") myClients();
  if(name==="repSummary") repSummary();

}


/* =====================================================
   DASHBOARD
===================================================== */

function dashboard(){

  document.getElementById("main").innerHTML=`

    <div class="hero">

      <h2>V-CareRx DCR</h2>

      <p>
        Welcome ${esc(currentUser.name)}
      </p>

      <p>
        ${esc(getRoleName(currentUser.role))}
      </p>

    </div>


    <div class="cards">

      <div class="card">
        Medical Representatives
        <div class="number">
          ${db.representatives.length}
        </div>
      </div>

      <div class="card">
        Doctors
        <div class="number">
          ${db.doctors.length}
        </div>
      </div>

      <div class="card">
        Chemists
        <div class="number">
          ${db.chemists.length}
        </div>
      </div>

      <div class="card">
        Stockists
        <div class="number">
          ${db.stockists.length}
        </div>
      </div>

    </div>


    <div class="panel">

      <h2>Quick Actions</h2>

      <div class="actions">

        <button class="btn"
          onclick="page('representatives')">
          + Medical Representative
        </button>

        <button class="btn"
          onclick="page('doctors')">
          + Doctor
        </button>

        <button class="btn"
          onclick="page('chemists')">
          + Chemist
        </button>

        <button class="btn"
          onclick="page('stockists')">
          + Stockist
        </button>

        <button class="btn blue"
          onclick="page('assignments')">
          🔗 Assignments
        </button>

        <button class="btn blue"
          onclick="page('reports')">
          📈 Reports
        </button>

      </div>

    </div>

  `;

}


/* =====================================================
   REPRESENTATIVES
===================================================== */

function representatives(){

  if(!adminOnly()) return;


  const rows =
    db.representatives.map((r,i)=>`

      <tr>

        <td>${esc(r.id)}</td>
        <td>${esc(r.name)}</td>
        <td>${esc(r.phone)}</td>

        <td>
          <span class="badge ${r.active?"":"off"}">
            ${r.active?"ACTIVE":"INACTIVE"}
          </span>
        </td>

        <td>

          <button class="btn small"
            onclick="toggleRep(${i})">
            ${r.active?"Deactivate":"Activate"}
          </button>

          <button class="btn red small"
            onclick="deleteRep(${i})">
            Delete
          </button>

        </td>

      </tr>

    `).join("");


  document.getElementById("main").innerHTML=`

    <div class="panel">

      <h2>Create Medical Representative</h2>

      <div class="grid">

        <div>
          <label>MR ID</label>
          <input id="repId"
                 placeholder="Example MR002">
        </div>

        <div>
          <label>Name</label>
          <input id="repName"
                 placeholder="Representative name">
        </div>

        <div>
          <label>Password</label>
          <input id="repPassword"
                 type="password"
                 placeholder="Create password">
        </div>

        <div>
          <label>Mobile</label>
          <input id="repPhone">
        </div>

      </div>

      <div class="actions">

        <button class="btn"
          onclick="createRep()">
          CREATE REPRESENTATIVE
        </button>

      </div>

    </div>


    <div class="panel">

      <h2>Medical Representatives</h2>

      <div class="tableWrap">

        <table>

          <tr>
            <th>MR ID</th>
            <th>Name</th>
            <th>Mobile</th>
            <th>Status</th>
            <th>Action</th>
          </tr>

          ${
            rows ||
            "<tr><td colspan='5'>No representatives</td></tr>"
          }

        </table>

      </div>

    </div>

  `;

}


function createRep(){

  const id =
    document.getElementById("repId")
      .value.trim();

  const name =
    document.getElementById("repName")
      .value.trim();

  const password =
    document.getElementById("repPassword")
      .value;

  const phone =
    document.getElementById("repPhone")
      .value.trim();


  if(!id || !name || !password){

    alert("Enter ID, name and password.");
    return;

  }


  if(db.representatives.some(
    r=>r.id.toLowerCase()===id.toLowerCase()
  )){

    alert("Representative ID already exists.");
    return;

  }


  db.representatives.push({

    id,
    name,
    password,
    phone,
    active:true

  });


  db.users.push({

    id,
    name,
    role:"mr",
    password,
    active:true

  });


  save();

  alert("Representative created successfully.");

  representatives();

}


function toggleRep(i){

  if(!adminOnly()) return;

  db.representatives[i].active =
    !db.representatives[i].active;

  const id=db.representatives[i].id;

  const user=db.users.find(u=>u.id===id);

  if(user){
    user.active=db.representatives[i].active;
  }

  save();

  representatives();

}


function deleteRep(i){

  if(!adminOnly()) return;

  const rep=db.representatives[i];

  if(!confirm("Delete "+rep.name+"?")) return;

  db.representatives.splice(i,1);

  db.users =
    db.users.filter(u=>u.id!==rep.id);

  db.assignments =
    db.assignments.filter(
      a=>a.repId!==rep.id
    );

  save();

  representatives();

}


/* =====================================================
   DOCTORS
===================================================== */

function doctors(){

  if(!["admin","ceo","md","manager"].includes(
    currentUser.role
  )){

    alert("Management access required.");
    return;

  }


  const rows =
    db.doctors.map((d,i)=>`

      <tr>

        <td>${esc(d.id)}</td>
        <td>${esc(d.name)}</td>
        <td>${esc(d.speciality)}</td>
        <td>${esc(d.phone)}</td>

        <td>
          ${
            d.lat && d.lng
            ? "📍 "+esc(d.lat)+", "+esc(d.lng)
            : "—"
          }
        </td>

        <td>

          ${
            currentUser.role==="admin"
            ? `<button class="btn red small"
                 onclick="deleteDoctor(${i})">
                 Delete
               </button>`
            : ""
          }

        </td>

      </tr>

    `).join("");


  document.getElementById("main").innerHTML=`

    <div class="panel">

      <h2>Add Doctor</h2>

      <div class="grid">

        <div>
          <label>Doctor ID</label>
          <input id="doctorId">
        </div>

        <div>
          <label>Doctor Name</label>
          <input id="doctorName">
        </div>

        <div>
          <label>Speciality</label>
          <input id="doctorSpeciality">
        </div>

        <div>
          <label>Phone</label>
          <input id="doctorPhone">
        </div>

        <div>
          <label>Latitude</label>
          <input id="doctorLat">
        </div>

        <div>
          <label>Longitude</label>
          <input id="doctorLng">
        </div>

      </div>

      <div class="actions">

        <button class="btn blue"
          onclick="getDoctorGPS()">
          📍 GET CURRENT LOCATION
        </button>

        <button class="btn"
          onclick="addDoctor()">
          ADD DOCTOR
        </button>

      </div>

    </div>

function captureDCRGPS(){

  if(!navigator.geolocation){

    alert("GPS not supported.");
    return;

  }


  document.getElementById("gpsStatus")
    .innerText="Getting location...";


  navigator.geolocation.getCurrentPosition(

    function(position){

      dcrGPS={

        lat:position.coords.latitude,
        lng:position.coords.longitude,
        accuracy:position.coords.accuracy

      };


      document.getElementById("gpsLat")
        .innerText=dcrGPS.lat.toFixed(6);

      document.getElementById("gpsLng")
        .innerText=dcrGPS.lng.toFixed(6);

      document.getElementById("gpsAccuracy")
        .innerText=
        Math.round(dcrGPS.accuracy)+" metres";


      document.getElementById("gpsStatus")
        .innerText=
        "Location captured successfully.";

    },


    function(){

      document.getElementById("gpsStatus")
        .innerText=
        "Location permission denied.";

      alert(
        "Allow Location permission for this website."
      );

    },


    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }

  );

}


function saveDCR(){

  const rep =
    document.getElementById("dcrRep").value;

  const doctor =
    document.getElementById("dcrDoctor").value;

  const date =
    document.getElementById("dcrDate").value;


  if(!rep || !doctor){

    alert("Select representative and doctor.");
    return;

  }


  if(
    db.settings.gpsRequired &&
    !dcrGPS
  ){

    alert("GPS location is required.");
    return;

  }


  db.dcr.push({

    id:Date.now(),

    repId:rep,

    doctorId:doctor,

    date:date,

    status:
      document.getElementById("dcrStatus").value,

    remarks:
      document.getElementById("dcrRemarks").value,

    gps:dcrGPS ? {

      lat:dcrGPS.lat,
      lng:dcrGPS.lng,
      accuracy:dcrGPS.accuracy

    } : null

  });


  save();

  dcrGPS=null;

  alert("DCR saved successfully.");

  if(currentUser.role==="mr")
    page("repSummary");
  else
    page("reports");

}

   SUMMARY
===================================================== */

function getRepStats(repId){

  const assignments =
    db.assignments.filter(
      a=>a.repId===repId
    );


  const doctors =
    assignments.map(
      a=>a.doctorId
    ).filter(Boolean);


  const chemists =
    assignments.map(
      a=>a.chemistId
    ).filter(Boolean);


  const stockists =
    assignments.map(
      a=>a.stockistId
    ).filter(Boolean);


  const records =
    db.dcr.filter(
      d=>d.repId===repId
    );


  const visits =
    records.filter(
      d=>d.status==="Visited"
    ).length;


  const activeDates =
    new Set(
      records
        .filter(d=>d.status==="Visited")
        .map(d=>d.date)
    );


  return {

    doctors:doctors.length,

    doctorVisits:
      new Set(
        records
          .filter(d=>d.status==="Visited")
          .map(d=>d.doctorId)
      ).size,

    chemists:chemists.length,

    stockists:stockists.length,

    totalVisits:visits,

    activeDays:activeDates.size,

    average:
      activeDates.size
      ? (visits/activeDates.size).toFixed(2)
      : "0.00"

  };

}

        <table>

          <tr>

            <th>Date</th>
            <th>Representative</th>
            <th>Client</th>
            <th>Type</th>
            <th>Status</th>
            <th>Action</th>

          </tr>

          ${
            rows ||
            "<tr><td colspan='6'>No tour plans</td></tr>"
          }

        </table>

      </div>

    </div>

  `;

}


function saveTour(){

  const rep =
    document.getElementById("tourRep").value;

  const date =
    document.getElementById("tourDate").value;

  const doctor =
    document.getElementById("tourDoctor").value;


  if(!rep || !date || !doctor){

    alert(
      "Select representative, date and doctor."
    );

    return;

  }


  db.tours.push({

    id:Date.now(),

    repId:rep,

    date:date,

    doctorId:doctor,

    type:
      document.getElementById("tourType").value,

    status:"Planned"

  });


  save();

  alert("Tour plan created.");

  tour();

}


function deleteTour(i){

  if(!adminOnly()) return;

  db.tours.splice(i,1);

  save();

  tour();

}

===================================================== */

function reports(){

  if(!["admin","ceo","md","manager"].includes(
    currentUser.role
  )){

    alert("Management access required.");
    return;

  }


  const rows =
    db.dcr
      .slice()
      .reverse()
      .map(d=>`

        <tr>

          <td>${esc(d.date)}</td>
          <td>${esc(d.repId)}</td>
          <td>${esc(d.doctorId)}</td>
          <td>${esc(d.status)}</td>

          <td>

            ${
              d.gps
              ? "📍 "+
                Number(d.gps.lat).toFixed(5)+
                ", "+
                Number(d.gps.lng).toFixed(5)

            }

          </td>

        </tr>

      `).join("");


  document.getElementById("main").innerHTML=`

    <div class="cards">

        Total DCR

          ${db.dcr.length}

      </div>


      <div class="card">

        Visited

        <div class="number">
          ${
            db.dcr.filter(
              x=>x.status==="Visited"
            ).length
          }
        </div>

      </div>


      <div class="card">

        Missed

        <div class="number">
          ${
            db.dcr.filter(
              x=>x.status==="Missed"
            ).length
          }
        </div>

      </div>


      <div class="card">

        Tour Plans

        <div class="number">
          ${db.tours.length}
        </div>

      </div>

    </div>


    <div class="panel">

      <h2>DCR Report</h2>

      <div class="tableWrap">

        <table>

          <tr>
            <th>Date</th>
            <th>MR</th>
            <th>Doctor</th>
            <th>Status</th>
            <th>GPS</th>
          </tr>

          ${
            rows ||
            "<tr><td colspan='5'>No DCR records</td></tr>"
          }

        </table>

      </div>

    </div>

  `;

}
