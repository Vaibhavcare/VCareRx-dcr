<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V-CareRx DCR</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6f8;color:#263238}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.loginPage{min-height:100vh;background:linear-gradient(135deg,#075078,#08ad98);display:flex;align-items:center;justify-content:center;padding:20px}
.loginBox{width:100%;max-width:430px;background:#fff;border-radius:22px;padding:30px;box-shadow:0 15px 40px #0004}
.logo{width:100px;height:100px;border:3px solid #075078;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;font-weight:bold;color:#075078}
.loginBox h1{text-align:center;margin:0}
.loginBox p{text-align:center;color:#68757b}
.field{margin:12px 0}
label{display:block;font-weight:bold;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd5d9;border-radius:7px;background:white}
textarea{min-height:90px}
.btn{border:0;background:#08a994;color:white;border-radius:7px;padding:10px 15px;font-weight:bold}
.btn.blue{background:#075078}.btn.red{background:#c62828}.btn.gray{background:#68757b}
.loginBtn{width:100%;padding:13px;font-size:17px}
.error{color:#c62828;text-align:center;margin-top:12px;font-weight:bold}
.app{min-height:100vh}
.top{height:62px;background:#081b24;color:white;display:flex;align-items:center;padding:0 15px;position:sticky;top:0;z-index:20}
.menu{background:none;color:white;border:0;font-size:28px;margin-right:16px}
.brand{font-size:20px;font-weight:bold}.topRight{margin-left:auto}
.topRight button{background:none;color:white;border:0;font-size:20px;margin-left:10px}
.sidebar{position:fixed;left:0;top:62px;bottom:0;width:245px;background:white;border-right:1px solid #ddd;overflow:auto}
.profile{background:#075078;color:white;text-align:center;padding:20px}
.avatar{width:65px;height:65px;background:white;color:#075078;border-radius:50%;display:grid;place-items:center;margin:auto;font-size:30px;font-weight:bold}
.nav button{width:100%;border:0;background:white;text-align:left;padding:14px 18px}
.nav button:hover,.nav button.active{background:#e4f7f4;color:#008d7e;font-weight:bold}
.main{margin-left:245px;padding:18px}
.hero{background:#08a994;color:white;padding:23px;border-radius:12px;margin-bottom:18px}
.hero h2{margin:0 0 6px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.card{background:white;padding:18px;border-radius:10px;box-shadow:0 1px 5px #0001}
.number{font-size:29px;font-weight:bold;margin-top:8px}
.panel{background:white;padding:18px;border-radius:10px;margin-top:18px;box-shadow:0 1px 5px #0001}
.panel h2{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 7px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}
th{background:#f2f5f6}
.tableWrap{overflow:auto}
.badge{padding:4px 8px;border-radius:20px;background:#dff5ef;color:#087d6e;font-size:12px}
.off{background:#eee;color:#777}
.location{background:#edf9f7;padding:15px;border-radius:8px}
.small{padding:7px 9px;font-size:12px}
.muted{color:#69777d}
.switch{display:flex;gap:10px;align-items:center;padding:15px 0;border-bottom:1px solid #eee}
.switch input{width:auto}
@media(max-width:800px){
.sidebar{transform:translateX(-100%);transition:.2s;width:270px}
.sidebar.open{transform:translateX(0)}
.main{margin-left:0}
.cards{grid-template-columns:repeat(2,1fr)}
.grid,.grid3{grid-template-columns:1fr}
}
@media(max-width:450px){.cards{grid-template-columns:1fr 1fr}.card{padding:13px}}
</style>
</head>

<script>
/* =====================================================
   BASIC DATABASE
===================================================== */

const ADMIN_ID="Vaibhav";
const ADMIN_PASSWORD="Vaibhav@123";

let db=JSON.parse(localStorage.getItem("VCARERX_DATABASE")||"null");

if(!db){
db={
 representatives:[
   {
    id:"MR001",
    name:"Tanuja",
    password:"Tanuja@123",
    phone:"",
    active:true
   }
 ],
 doctors:[],
 chemists:[],
 stockists:[],
 products:[],
 assignments:[],
 dcr:[],
 tours:[],
 settings:{gpsRequired:true}
};

save();
}

let currentUser=null;
let dcrGPS=null;

function save(){
localStorage.setItem("VCARERX_DATABASE",JSON.stringify(db));
}

function esc(v){
return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#39;");
}

/* =====================================================
   LOGIN
===================================================== */

function login(){

let id=document.getElementById("loginId").value.trim();
let password=document.getElementById("loginPassword").value;

if(id===ADMIN_ID && password===ADMIN_PASSWORD){

currentUser={
 type:"admin",
 id:"ADMIN",
 name:"Vaibhav"
};

openApp();
return;
}

let rep=db.representatives.find(
r=>r.id.toLowerCase()===id.toLowerCase()
&& r.password===password
);

if(rep){

if(!rep.active){
document.getElementById("loginError").innerText=
"Your representative account is inactive.";
return;
}

currentUser={
 type:"rep",
 id:rep.id,
 name:rep.name
};

openApp();
return;
}

document.getElementById("loginError").innerText=
"Invalid ID or password";
}

document.getElementById("loginPassword").addEventListener(
"keydown",function(e){
if(e.key==="Enter") login();
});

function openApp(){

document.getElementById("loginPage").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");

if(currentUser.type==="admin"){

document.getElementById("adminNav").classList.remove("hidden");
document.getElementById("repNav").classList.add("hidden");

document.getElementById("profileName").innerText="Vaibhav";
document.getElementById("profileRole").innerText="Administrator";

page("dashboard");

}else{

document.getElementById("adminNav").classList.add("hidden");
document.getElementById("repNav").classList.remove("hidden");

document.getElementById("profileName").innerText=currentUser.name;
document.getElementById("profileRole").innerText=
"Representative • "+currentUser.id;

page("repHome");
}
}

function logout(){

currentUser=null;

document.getElementById("app").classList.add("hidden");
document.getElementById("loginPage").classList.remove("hidden");

document.getElementById("loginId").value="";
document.getElementById("loginPassword").value="";
}

/* =====================================================
   NAVIGATION
===================================================== */

function toggleMenu(){
document.getElementById("sidebar").classList.toggle("open");
}

function page(name){

document.getElementById("sidebar")
.classList.remove("open");

if(name==="dashboard") dashboard();
if(name==="summary") summary();
if(name==="representatives") representatives();
if(name==="doctors") doctors();
if(name==="chemists") chemists();
if(name==="stockists") stockists();
if(name==="products") products();
if(name==="assignments") assignments();
if(name==="dcr") dcr();
if(name==="visitStatus") visitStatus();
if(name==="tour") tour();
if(name==="reports") reports();
if(name==="settings") settings();

if(name==="repHome") repHome();
if(name==="myClients") myClients();
if(name==="repSummary") repSummary();
}

/* =====================================================

function createRep(){

let id=document.getElementById("repId").value.trim();
let name=document.getElementById("repName").value.trim();
let password=document.getElementById("repPassword").value;
let phone=document.getElementById("repPhone").value.trim();

if(!id||!name||!password){
alert("Enter ID, name and password.");
return;
}

if(db.representatives.some(
r=>r.id.toLowerCase()===id.toLowerCase()
)){
alert("Representative ID already exists.");
return;
}

db.representatives.push({
id:id,
name:name,
password:password,
phone:phone,
active:true
});

save();

alert(
"Representative created successfully.\n\n"+
"ID: "+id+
"\nPassword: "+password
);

representatives();
}

function toggleRep(i){

db.representatives[i].active=
!db.representatives[i].active;

save();
representatives();
}

function deleteRep(i){

let rep=db.representatives[i];

if(!confirm(
"Delete "+rep.name+"?\n"+
"The representative will also lose all assignments."
))return;

db.representatives.splice(i,1);

db.assignments=
db.assignments.filter(a=>a.repId!==rep.id);

save();

representatives();
}

<tr>

<th>Action</th>

${rows||"<tr><td colspan=6>No doctors</td></tr>"}

function getDoctorGPS(){

navigator.geolocation.getCurrentPosition(

function(position){

document.getElementById("doctorLat").value=
position.coords.latitude.toFixed(6);

document.getElementById("doctorLng").value=
position.coords.longitude.toFixed(6);

alert("Doctor location captured.");

},

function(){

alert(
"Location permission denied. "+
"Allow location permission in Chrome."
);

},

{
enableHighAccuracy:true,
timeout:15000
}

);
}

function addDoctor(){

let d={
id:document.getElementById("doctorId").value.trim(),
name:document.getElementById("doctorName").value.trim(),
speciality:document.getElementById("doctorSpeciality").value.trim(),
phone:document.getElementById("doctorPhone").value.trim(),
lat:document.getElementById("doctorLat").value.trim(),
lng:document.getElementById("doctorLng").value.trim()
};

if(!d.id||!d.name){
alert("Doctor ID and name are required.");
return;
}

if(db.doctors.some(x=>x.id===d.id)){
alert("Doctor ID already exists.");
return;
}

db.doctors.push(d);
save();

doctors();
}

/* =====================================================

===================================================== */

function assignments(){

let repOptions=db.representatives
.filter(r=>r.active)

function captureDCRGPS(){

if(!navigator.geolocation){

alert("GPS not supported.");
return;
}

document.getElementById("gpsStatus").innerText=
"Getting location...";

navigator.geolocation.getCurrentPosition(

function(position){

dcrGPS={
lat:position.coords.latitude,
lng:position.coords.longitude,
accuracy:position.coords.accuracy
};

document.getElementById("gpsLat").innerText=
dcrGPS.lat.toFixed(6);

document.getElementById("gpsLng").innerText=
dcrGPS.lng.toFixed(6);

document.getElementById("gpsAccuracy").innerText=
Math.round(dcrGPS.accuracy)+" metres";

document.getElementById("gpsStatus").innerText=
"Location captured successfully.";

},

function(){

document.getElementById("gpsStatus").innerText=
"Location permission denied.";

alert(
"Allow Location permission for this website in Chrome."
);

},

{
enableHighAccuracy:true,
timeout:15000,
maximumAge:0
}

);
}

function saveDCR(){

let rep=document.getElementById("dcrRep").value;
let doctor=document.getElementById("dcrDoctor").value;
let date=document.getElementById("dcrDate").value;

if(!rep||!doctor){

alert("Select representative and doctor.");
return;
}

if(db.settings.gpsRequired&&!dcrGPS){

alert("GPS location is required.");
return;
}

db.dcr.push({

id:Date.now(),

repId:rep,

doctorId:doctor,

date:date,

status:document.getElementById("dcrStatus").value,

remarks:document.getElementById("dcrRemarks").value,

gps:dcrGPS?{
lat:dcrGPS.lat,
lng:dcrGPS.lng,
accuracy:dcrGPS.accuracy
}:null

});

save();

dcrGPS=null;

alert("DCR saved successfully.");

if(currentUser.type==="admin")page("reports");
else page("repSummary");
}

/* =====================================================
   QUICK SUMMARY
===================================================== */

function getRepStats(repId){

let assignments=db.assignments
.filter(a=>a.repId===repId);

let doctorsAssigned=
assignments.map(a=>a.doctorId).filter(Boolean);

let chemAssigned=
assignments.map(a=>a.chemistId).filter(Boolean);

let stockAssigned=
assignments.map(a=>a.stockistId).filter(Boolean);

let records=db.dcr.filter(
d=>d.repId===repId
);

let doctorVisits=
new Set(records
.filter(d=>d.status==="Visited")
.map(d=>d.doctorId)
).size;

let activeDates=
new Set(records
.filter(d=>d.status==="Visited")
.map(d=>d.date)
);

let visits=records.filter(
d=>d.status==="Visited"
).length;

return{

doctors:doctorsAssigned.length,
doctorVisits:doctorVisits,

chemists:chemAssigned.length,

stockists:stockAssigned.length,

totalVisits:visits,

activeDays:activeDates.size,

average:activeDates.size?
(visits/activeDates.size).toFixed(2):"0.00"

};
}
