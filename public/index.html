<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V-CareRx DCR</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6f7;color:#263238}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}

.login{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 background:linear-gradient(135deg,#075074,#08ad98);
 padding:20px
}
.loginBox{
 width:100%;
 max-width:420px;
 background:white;
 padding:32px;
 border-radius:25px;
 box-shadow:0 15px 40px #0005
}
.logo{
 width:100px;height:100px;border:3px solid #075074;
 border-radius:50%;display:grid;place-items:center;
 margin:auto;color:#075074;font-weight:bold
}
.loginBox h1{text-align:center;margin:18px 0 5px}
.loginBox p{text-align:center;color:#777}
.loginBox input{
 width:100%;padding:14px;margin:7px 0;
 border:1px solid #ccc;border-radius:9px
}
.btn{
 background:#08ad98;color:white;
 padding:12px 17px;border-radius:8px;font-weight:bold
}
.full{width:100%;margin-top:10px}
.error{color:#d32f2f;text-align:center;margin-top:10px}

.app{display:none;min-height:100vh}
.top{
 height:64px;background:#071b25;color:white;
 display:flex;align-items:center;padding:0 16px;
 position:sticky;top:0;z-index:10
}
.menu{font-size:27px;background:none;color:white;margin-right:15px}
.brand{font-size:20px;font-weight:bold}
.logout{margin-left:auto;background:#d32f2f;color:white;padding:9px 14px;border-radius:7px}

.side{
 position:fixed;top:64px;bottom:0;left:0;
 width:245px;background:white;border-right:1px solid #ddd;
 overflow:auto
}
.profile{
 background:#075074;color:white;text-align:center;padding:22px
}
.avatar{
 width:65px;height:65px;border-radius:50%;
 background:white;color:#075074;
 display:grid;place-items:center;
 margin:auto;font-size:30px;font-weight:bold
}
.nav button{
 width:100%;background:white;text-align:left;
 padding:14px 18px;border-bottom:1px solid #eee
}
.nav button:hover{background:#e7f7f4}

.main{margin-left:245px;padding:20px}
.page{display:none}
.page.active{display:block}

.hero{
 background:#08ad98;color:white;
 border-radius:12px;padding:24px;margin-bottom:18px
}
.hero h2{margin:0 0 7px}

.cards{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:14px
}
.card{
 background:white;padding:20px;
 border-radius:10px;
 box-shadow:0 2px 7px #0001
}
.number{font-size:30px;font-weight:bold;margin-top:7px}

.panel{
 background:white;padding:20px;
 border-radius:10px;
 margin-top:18px;
 box-shadow:0 2px 7px #0001
}
.panel h2{margin-top:0}

.formGrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px
}
.formGrid input,.formGrid select,.formGrid textarea{
 width:100%;padding:11px;
 border:1px solid #ccd4d8;
 border-radius:7px
}

table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{
 padding:11px 7px;
 border-bottom:1px solid #ddd;
 text-align:left
}
th{background:#f1f5f6}

.small{
 padding:7px 10px;
 border-radius:6px;
 font-size:13px;
 margin:2px
}
.red{background:#d32f2f;color:white}
.blue{background:#1976d2;color:white}
.gray{background:#777;color:white}

.badge{
 padding:5px 9px;border-radius:20px;
 background:#d9f5ec;color:#08795f;
 font-size:12px
}
.badge.off{background:#eee;color:#777}

 background
