<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>V-CareRx DCR</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 padding:0;
 width:100%;
 min-height:100%;
 font-family:Arial,Helvetica,sans-serif;
 background:#f2faff;
 color:#20323b;
}

body{
 overflow-x:hidden;
}

button,input,select,textarea{
 font:inherit;
}

button{
 cursor:pointer;
}

.hidden{
 display:none!important;
}

/* ================= LOGIN ================= */

.loginPage{
 min-height:100vh;
 min-height:100dvh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:16px;
 background:
 linear-gradient(145deg,#dff6ff 0%,#ffffff 48%,#ccefff 100%);
}

.loginBox{
 width:100%;
 max-width:400px;
 background:#fff;
 border:1px solid #d5edf8;
 border-radius:28px;
 padding:28px 22px;
 box-shadow:0 20px 55px rgba(0,105,160,.18);
}

.logo{
 width:92px;
 height:92px;
 border-radius:24px;
 margin:0 auto 18px;
 display:grid;
 place-items:center;
 background:linear-gradient(145deg,#ffffff,#e8f8ff);
 border:4px solid #43bee8;
 color:#087ca7;
 font-size:17px;
 font-weight:800;
 box-shadow:0 8px 20px rgba(0,130,180,.12);
}

.loginBox h1{
 margin:0;
 text-align:center;
 color:#075078;
 font-size:26px;
}

.loginBox .subtitle{
 text-align:center;
 color:#71828b;
 margin:8px 0 24px;
 font-size:14px;
}

.field{
 margin:14px 0;
}

label{
 display:block;
 font-weight:700;
 margin-bottom:7px;
 color:#31434b;
}

input,select,textarea{
 width:100%;
 padding:12px;
 border:1px solid #cde4ee;
 border-radius:11px;
 background:#fff;
 outline:none;
}

input:focus,select:focus,textarea:focus{
 border-color:#32b8e4;
 box-shadow:0 0 0 3px rgba(50,184,228,.12);
}

textarea{
 min-height:100px;
 resize:vertical;
}

.btn{
 border:0;
 border-radius:10px;
 padding:11px 15px;
 background:#08a994;
 color:#fff;
 font-weight:700;
}

.btn:hover{
 opacity:.92;
}

.btn.blue{
 background:#087aa8;
}

.btn.red{
 background:#c62828;
}

.btn.gray{
 background:#69777d;
}

.loginBtn{
 width:100%;
 padding:14px;
 font-size:17px;
 border-radius:13px;
 background:linear-gradient(90deg,#079ed2,#08b49f);
 box-shadow:0 9px 20px rgba(8,165,180,.22);
}

.error{
 color:#c62828;
 text-align:center;
 margin-top:12px;
 font-weight:700;
 min-height:20px;
}

/* ================= APP ================= */

.app{
 min-height:100vh;
}

.top{
 height:62px;
 background:#075078;
 color:#fff;
 display:flex;
 align-items:center;
 padding:0 15px;
 position:sticky;
 top:0;
 z-index:100;
 box-shadow:0 2px 10px #0002;
}

.menu{
 background:none;
 color:#fff;
 border:0;
 font-size:28px;
 margin-right:14px;
}

.brand{
 font-size:20px;
 font-weight:800;
}

.topRight{
 margin-left:auto;
 display:flex;
 gap:7px;
}

.topRight button{
 background:#ffffff18;
 color:#fff;
 border:1px solid #ffffff33;
 border-radius:8px;
 padding:8px 12px;
 font-size:13px;
}

/* ================= SIDEBAR ================= */

.sidebar{
 position:fixed;
 left:0;
 top:62px;
 bottom:0;
 width:250px;
 background:#fff;
 border-right:1px solid #dce8ed;
 overflow:auto;
 z-index:90;
}

.profile{
 background:linear-gradient(145deg,#087aa8,#08aa98);
 color:#fff;
 text-align:center;
 padding:22px 15px;
}

.avatar{
 width:68px;
 height:68px;
 background:#fff;
 color:#087aa8;
 border-radius:50%;
 display:grid;
 place-items:center;
 margin:auto;
 font-size:29px;
 font-weight:800;
 border:3px solid #ffffffaa;
}

.profile h3{
 margin:10px 0 4px;
}

.profile small{
 opacity:.9;
}

.nav button{
 width:100%;
 border:0;
 background:#fff;
 text-align:left;
 padding:14px 18px;
 color:#344850;
}

.nav button:hover,
.nav button.active{
 background:#e8f8ff;
 color:#087ca8;
 font-weight:700;
}

/* ================= MAIN ================= */

.main{
 margin-left:250px;
 padding:18px;
 max-width:1500px;
}

.hero{
 background:linear-gradient(135deg,#08a994,#087aa8);
 color:#fff;
 padding:23px;
 border-radius:15px;
 margin-bottom:18px;
 box-shadow:0 5px 18px #0001;
}

.hero h2{
 margin:0 0 7px;
}

.hero p{
 margin:5px 0;
}

.cards{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:13px;
}

.card{
 background:#fff;
 padding:18px;
 border-radius:13px;
 box-shadow:0 2px 9px #00000010;
 border:1px solid #e3eef2;
}

.number{
 font-size:29px;
 font-weight:800;
 margin-top:8px;
 color:#087aa8;
}

.panel{
 background:#fff;
 padding:18px;
 border-radius:13px;
 margin-top:18px;
 box-shadow:0 2px 9px #00000010;
 border:1px solid #e3eef2;
}

.panel h2{
 margin-top:0;
 color:#075078;
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
}

.grid3{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:12px;
}

.actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-top:14px;
}

.tableWrap{
 overflow-x:auto;
}

table{
 width:100%;
 border-collapse:collapse;
 min-width:650px;
}

th,td{
 padding:10px 8px;
 border-bottom:1px solid #e0e8eb;
 text-align:left;
 font-size:13px;
}

th{
 background:#eef8fc;
 color:#075078;
}

.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:20px;
 background:#dff5ef;
 color:#087d6e;
 font-size:12px;
 font-weight:700;
}

.off{
 background:#eee;
 color:#777;
}

.location{
 background:#eaf9ff;
 border:1px solid #ccecf8;
 padding:15px;
 border-radius:11px;
}

.muted{
 color:#69777d;
 font-size:13px;
}

.small{
 padding:7px 9px;
 font-size:12px;
}

.switch{
 display:flex;
 gap:10px;
 align-items:center;
 padding:15px 0;
 border-bottom:1px solid #eee;
}

.switch input{
 width:auto;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

 .sidebar{
  transform:translateX(-100%);
  transition:.2s;
  width:275px;
  box-shadow:5px 0 20px #0002;
 }

 .sidebar.open{
  transform:translateX(0);
 }

 .main{
  margin-left:0;
  padding:12px;
 }

 .cards{
  grid-template-columns:repeat(2,1fr);
 }

 .grid,.grid3{
  grid-template-columns:1fr;
 }

 .brand{
  font-size:17px;
 }

 .top{
  padding:0 10px;
 }
}

@media(max-width:450px){

 .loginBox{
  padding:23px 17px;
  border-radius:23px;
 }

 .cards{
  grid-template-columns:1fr 1fr;
  gap:8px;
 }

 .card{
  padding:13px;
 }

 .number{
  font-size:24px;
 }

 .hero{
  padding:18px;
 }

 .panel{
  padding:14px;
 }

 .topRight button{
  padding:7px 9px;
 }

}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage" class="loginPage">

 <div class="loginBox">

  <div class="logo">V-CareRx</div>

  <h1>V-CareRx DCR</h1>

  <div class="subtitle">
   Medical Representative Reporting System
  </div>

  <div class="field">
   <label>Login ID</label>
   <input
    id="loginId"
    autocomplete="username"
    placeholder="Enter Login ID">
  </div>

  <div class="field">
   <label>Password</label>
   <input
    id="loginPassword"
    type="password"
    autocomplete="current-password"
    placeholder="Enter Password">
  </div>

  <button class="btn loginBtn" onclick="login()">
   SIGN IN
  </button>

  <div id="loginError" class="error"></div>

 </div>
</div>


<!-- ================= APPLICATION ================= -->

<div id="app" class="app hidden">

<header class="top">

 <button class="menu" onclick="toggleMenu()">☰</button>

 <div class="brand">
  V-CareRx DCR
 </div>

 <div class="topRight">

  <button onclick="signIn()">
   📍 Sign In
  </button>

  <button onclick="signOut()">
   🚪 Sign Out
  </button>

 </div>

</header>


<aside id="sidebar" class="sidebar">

 <div class="profile">

  <div class="avatar" id="profileAvatar">
   V
  </div>

  <h3 id="profileName">
   Vaibhav Dalavi
  </h3>

  <small id="profileRole">
   Administrator
  </small>

 </div>


 <!-- ADMIN MENU -->

 <div class="nav" id="adminNav">

  <button onclick="page('dashboard')">
   🏠 Dashboard
  </button>

  <button onclick="page('summary')">
   📊 Quick Summary
  </button>

  <button onclick="page('representatives')">
   👥 Representatives
  </button>

  <button onclick="page('doctors')">
   🩺 Doctors
  </button>

  <button onclick="page('chemists')">
   💊 Chemists
  </button>

  <button onclick="page('stockists')">
   📦 Stockists
  </button>

  <button onclick="page('products')">
   🧴 Products
  </button>

  <button onclick="page('assignments')">
   🔗 Assignments
  </button>

  <button onclick="page('dcr')">
   📝 DCR
  </button>

  <button onclick="page('reports')">
   📈 Reports
  </button>

  <button onclick="page('settings')">
   ⚙️ Admin Settings
  </button>

  <button onclick="logout()">
   🚪 Logout
  </button>

 </div>


 <!-- REPRESENTATIVE MENU -->

 <div class="nav hidden" id="repNav">

  <button onclick="page('repHome')">
   🏠 My Dashboard
  </button>

  <button onclick="page('myClients')">
   👨‍⚕️ My Clients
  </button>

  <button onclick="page('dcr')">
   📝 DCR Entry
  </button>

  <button onclick="page('repSummary')">
   📊 My Summary
  </button>

  <button onclick="logout()">
   🚪 Logout
  </button>

 </div>

</aside>


<main id="main" class="main"></main>

</div>


<script>

/* =====================================================
   LOGIN DATABASE
===================================================== */

const ADMIN_ID = "Vaibhav";
const ADMIN_PASSWORD = "Vaibhav@admin";

let db = JSON.parse(
 localStorage.getItem("VCARERX_DATABASE") || "null"
);

if(!db){

 db = {

  representatives:[
   {
    id:"MR001",
    name:"Tanuja",
    password:"Tanuja@123",
    phone:"",
    active:true
   }
  ],

  doctors:[
   {
    id:"DOC001",
    name:"Sample Doctor",
    speciality:"General Physician",
    phone:"",
    lat:"",
    lng:""
   }
  ],

  chemists:[
   {
    id:"CHEM001",
    name:"Sample Chemist",
    phone:"",
    address:""
   }
  ],

  stockists:[
   {
    id:"STK001",
    name:"Sample Stockist",
    phone:"",
    address:""
   }
  ],

  products:[],

  assignments:[],

  dcr:[],

  settings:{
   gpsRequired:true
  },

  attendance:[]

 };

 save();
}

let currentUser = null;
let currentGPS = null;


/* =====================================================
   DATABASE
===================================================== */

function save(){

 localStorage.setItem(
  "VCARERX_DATABASE",
  JSON.stringify(db)
 );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(v){

 return String(v ?? "")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#39;");

}


/* =====================================================
   LOGIN
===================================================== */

function login(){

 const id =
 document.getElementById("loginId").value.trim();

 const password =
 document.getElementById("loginPassword").value;

 const error =
 document.getElementById("loginError");

 error.innerText="";


 /* ADMIN */

 if(
  id.toLowerCase() === ADMIN_ID.toLowerCase() &&
  password === ADMIN_PASSWORD
 ){

  currentUser={
   type:"admin",
   id:"ADMIN",
   name:"Vaibhav Dalavi"
  };

  openApp();
  return;
 }


 /* REPRESENTATIVE */

 const rep = db.representatives.find(
  r =>
   r.id.toLowerCase() === id.toLowerCase() &&
   r.password === password
 );


 if(rep){

  if(!rep.active){

   error.innerText =
   "Your account is inactive.";

   return;
  }

  currentUser={
   type:"rep",
   id:rep.id,
   name:rep.name
  };

  openApp();
  return;
 }


 error.innerText =
 "Invalid Login ID or Password";

}


document.getElementById(
 "loginPassword"
).addEventListener(
 "keydown",
 function(e){
  if(e.key==="Enter") login();
 }
);


/* =====================================================
   OPEN APPLICATION
===================================================== */

function openApp(){

 document.getElementById(
  "loginPage"
 ).classList.add("hidden");

 document.getElementById(
  "app"
 ).classList.remove("hidden");


 if(currentUser.type==="admin"){

  document.getElementById(
   "adminNav"
  ).classList.remove("hidden");

  document.getElementById(
   "repNav"
  ).classList.add("hidden");

  document.getElementById(
   "profileName"
  ).innerText="Vaibhav Dalavi";

  document.getElementById(
   "profileRole"
  ).innerText="Administrator";

  document.getElementById(
   "profileAvatar"
  ).innerText="V";

  page("dashboard");

 }else{

  document.getElementById(
   "adminNav"
  ).classList.add("hidden");

  document.getElementById(
   "repNav"
  ).classList.remove("hidden");

  document.getElementById(
   "profileName"
  ).innerText=currentUser.name;

  document.getElementById(
   "profileRole"
  ).innerText=
   "Representative • "+currentUser.id;

  document.getElementById(
   "profileAvatar"
  ).innerText=
   currentUser.name.charAt(0).toUpperCase();

  page("repHome");
 }

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

 currentUser=null;
 currentGPS=null;

 document.getElementById(
  "app"
 ).classList.add("hidden");

 document.getElementById(
  "loginPage"
 ).classList.remove("hidden");

 document.getElementById(
  "loginId"
 ).value="";

 document.getElementById(
  "loginPassword"
 ).value="";

}


/* =====================================================
   MENU
===================================================== */

function toggleMenu(){

 document.getElementById(
  "sidebar"
 ).classList.toggle("open");

}


/* =====================================================
   PAGE ROUTER
===================================================== */

function page(name){

 document.getElementById(
  "sidebar"
 ).classList.remove("open");


 if(
  currentUser.type!=="admin" &&
  [
   "dashboard",
   "summary",
   "representatives",
   "doctors",
   "chemists",
   "stockists",
   "products",
   "assignments",
   "reports",
   "settings"
  ].includes(name)
 ){

  alert(
   "Admin access required."
  );

  return;
 }


 if(name==="dashboard") dashboard();
 if(name==="summary") summary();
 if(name==="representatives") representatives();
 if(name==="doctors") doctors();
 if(name==="chemists") chemists();
 if(name==="stockists") stockists();
 if(name==="products") products();
 if(name==="assignments") assignments();
 if(name==="dcr") dcr();
 if(name==="reports") reports();
 if(name==="settings") settings();
 if(name==="repHome") repHome();
 if(name==="myClients") myClients();
 if(name==="repSummary") repSummary();

}


/* =====================================================
   DASHBOARD
===================================================== */

function dashboard(){

 document.getElementById("main").innerHTML=`

 <div class="hero">
  <h2>Administrator Dashboard</h2>
  <p>Welcome Vaibhav Dalavi</p>
  <p>Manage V-CareRx DCR operations.</p>
 </div>

 <div class="cards">

  <div class="card">
   Representatives
   <div class="number">
    ${db.representatives.length}
   </div>
  </div>

  <div class="card">
   Doctors
   <div class="number">
    ${db.doctors.length}
   </div>
  </div>

  <div class="card">
   Chemists
   <div class="number">
    ${db.chemists.length}
   </div>
  </div>

  <div class="card">
   Stockists
   <div class="number">
    ${db.stockists.length}
   </div>
  </div>

 </div>

 <div class="panel">

  <h2>Quick Actions</h2>

  <div class="actions">

   <button class="btn"
    onclick="page('representatives')">
    + Representative
   </button>

   <button class="btn"
    onclick="page('doctors')">
    + Doctor
   </button>

   <button class="btn"
    onclick="page('chemists')">
    + Chemist
   </button>

   <button class="btn"
    onclick="page('stockists')">
    + Stockist
   </button>

   <button class="btn blue"
    onclick="page('dcr')">
    📝 DCR
   </button>

  </div>

 </div>
 `;

}


/* =====================================================
   REPRESENTATIVES
===================================================== */

function representatives(){

 let rows=db.representatives.map(
 (r,i)=>`

 <tr>
  <td>${esc(r.id)}</td>
  <td>${esc(r.name)}</td>
  <td>${esc(r.phone)}</td>

  <td>
   <span class="badge ${r.active?"":"off"}">
    ${r.active?"ACTIVE":"INACTIVE"}
   </span>
  </td>

  <td>
   <button class="btn small"
    onclick="toggleRep(${i})">
    ${r.active?"Deactivate":"Activate"}
   </button>

   <button class="btn red small"
    onclick="deleteRep(${i})">
    Delete
   </button>
  </td>
 </tr>

 `).join("");

 document.getElementById("main").innerHTML=`

 <div class="panel">

  <h2>Create Representative</h2>

  <div class="grid">

   <div>
    <label>Representative ID</label>
    <input id="repId"
     placeholder="MR002">
   </div>

   <div>
    <label>Name</label>
    <input id="repName">
   </div>

   <div>
    <label>Password</label>
    <input id="repPassword"
     type="password">
   </div>

   <div>
    <label>Mobile</label>
    <input id="repPhone">
   </div>

  </div>

  <div class="actions">
   <button class="btn"
    onclick="createRep()">
    CREATE REPRESENTATIVE
   </button>
  </div>

 </div>

 <div class="panel">

  <h2>Representative Accounts</h2>

  <div class="tableWrap">

   <table>

    <tr>
     <th>MR ID</th>
     <th>Name</th>
     <th>Mobile</th>
     <th>Status</th>
     <th>Action</th>
    </tr>

    ${rows ||
    "<tr><td colspan='5'>No representatives</td></tr>"}

   </table>

  </div>

 </div>

 `;

}


function createRep(){

 const id=
 document.getElementById("repId").value.trim();

 const name=
 document.getElementById("repName").value.trim();

 const password=
 document.getElementById("repPassword").value;

 const phone=
 document.getElementById("repPhone").value.trim();


 if(!id||!name||!password){

  alert(
   "Enter ID, name and password."
  );

  return;
 }


 if(
  db.representatives.some(
   r=>r.id.toLowerCase()===id.toLowerCase()
  )
 ){

  alert(
   "Representative ID already exists."
  );

  return;
 }


 db.representatives.push({

  id,
  name,
  password,
  phone,
  active:true

 });

 save();

 alert(
  "Representative created successfully."
 );

 representatives();

}


function toggleRep(i){

 db.representatives[i].active =
 !db.representatives[i].active;

 save();

 representatives();

}


function deleteRep(i){

 if(!confirm(
  "Delete this representative?"
 )) return;

 const id=
 db.representatives[i].id;

 db.representatives.splice(i,1);

 db.assignments=
 db.assignments.filter(
  a=>a.repId!==id
 );

 save();

 representatives();

}


/* =====================================================
   DOCTORS
===================================================== */

function doctors(){

 let rows=db.doctors.map(
 (d,i)=>`

 <tr>

  <td>${esc(d.id)}</td>
  <td>${esc(d.name)}</td>
  <td>${esc(d.speciality)}</td>
  <td>${esc(d.phone)}</td>

  <td>
   ${
    d.lat && d.lng
    ? "📍 "+esc(d.lat)+", "+esc(d.lng)
    : "—"
   }
  </td>

  <td>

   <button class="btn red small"
    onclick="deleteDoctor(${i})">
    Delete
   </button>

  </td>

 </tr>

 `).join("");


 document.getElementById("main").innerHTML=`

 <div class="panel">

  <h2>🩺 Doctor Management</h2>

  <div class="grid">

   <div>
    <label>Doctor ID</label>
    <input id="doctorId">
   </div>

   <div>
    <label>Doctor Name</label>
    <input id="doctorName">
   </div>

   <div>
    <label>Speciality</label>
    <input id="doctorSpeciality">
   </div>

   <div>
    <label>Phone</label>
    <input id="doctorPhone">
   </div>

   <div>
    <label>Latitude</label>
    <input id="doctorLat">
   </div>

   <div>
    <label>Longitude</label>
    <input id="doctorLng">
   </div>

  </div>

  <div class="actions">

   <button class="btn blue"
    onclick="getDoctorGPS()">
    📍 Get Location
   </button>

   <button class="btn"
    onclick="addDoctor()">
    ADD DOCTOR
   </button>

  </div>

 </div>


 <div class="panel">

  <h2>Doctor List</h2>

  <div class="tableWrap">

   <table>

    <tr>
     <th>ID</th>
     <th>Doctor</th>
     <th>Speciality</th>
     <th>Phone</th>
     <th>Location</th>
     <th>Action</th>
    </tr>

    ${
     rows ||
     "<tr><td colspan='6'>No doctors</td></tr>"
    }

   </table>

  </div>

 </div>

 `;

}


function getDoctorGPS(){

 if(!navigator.geolocation){

  alert(
   "GPS is not supported."
  );

  return;
 }


 navigator.geolocation.getCurrentPosition(

  function(position){

   document.getElementById(
    "doctorLat"
   ).value=
   position.coords.latitude.toFixed(6);

   document.getElementById(
    "doctorLng"

function captureAttendance(type){

 if(!currentUser){
  return;
 }

 if(!navigator.geolocation){

  alert(
   "Location is not supported by this browser."
  );

  return;
 }


 navigator.geolocation.getCurrentPosition(

  function(position){

   const record={

    id:Date.now(),

    userId:currentUser.id,

    userName:currentUser.name,

    type:type,

    time:new Date().toISOString(),

    latitude:
     position.coords.latitude,

    longitude:
     position.coords.longitude,

    accuracy:
     position.coords.accuracy

   };


   db.attendance.push(record);

   save();


   alert(
    type+" location captured successfully."
   );

  },

  function(){

   alert(
    "Please allow location permission for V-CareRx DCR."
   );

  },

  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:0
  }

 );

}

 captureAttendance("SIGN IN");

}


function signOut(){

 captureAttendance("SIGN OUT");

}

function captureDCRGPS(){

 if(!navigator.geolocation){

  alert(
   "GPS not supported."
  );

  return;
 }


 document.getElementById(
  "gpsStatus"
 ).innerText=
 "Getting location...";


 navigator.geolocation.getCurrentPosition(

  function(position){

   currentGPS={

    lat:position.coords.latitude,

    lng:position.coords.longitude,

    accuracy:position.coords.accuracy

   };


   document.getElementById(
    "gpsLat"
   ).innerText=
   currentGPS.lat.toFixed(6);


   document.getElementById(
    "gpsLng"
   ).innerText=
   currentGPS.lng.toFixed(6);


   document.getElementById(
    "gpsAccuracy"
   ).innerText=
   Math.round(
    currentGPS.accuracy
   )+" metres";


   document.getElementById(
    "gpsStatus"
   ).innerText=
   "Location captured successfully.";

  },

  function(){

   document.getElementById(
    "gpsStatus"
   ).innerText=
   "Location permission denied.";

   alert(
    "Please allow Location permission."
   );

  },

  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:0
  }

 );

}


function saveDCR(){

 const rep=
 document.getElementById(
  "dcrRep"
 ).value;

 const doctor=
 document.getElementById(
  "dcrDoctor"
 ).value;


 if(!rep||!doctor){

  alert(
   "Select representative and doctor."
  );

  return;
 }


 if(
  db.settings.gpsRequired &&
  !currentGPS
 ){

  alert(
   "GPS location is required."
  );

  return;
 }


 db.dcr.push({

  id:Date.now(),

  repId:rep,

  doctorId:doctor,

  date:
   document.getElementById(
    "dcrDate"
   ).value,

  status:
   document.getElementById(
    "dcrStatus"
   ).value,

  remarks:
   document.getElementById(
    "dcrRemarks"
   ).value,

  gps:currentGPS

 });


 save();

 currentGPS=null;

 alert(
  "DCR saved successfully."
 );

 if(currentUser.type==="admin"){
  reports();
 }else{
  repSummary();
 }

}
